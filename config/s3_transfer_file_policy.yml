# =============================================================================
# S3 TRANSFER FILE POLICY  (user-data platform migration — Part 2 / file transfer)
# =============================================================================
#
# PURPOSE
# When migrating a user to a partner instance we copy their S3 objects to the
# partner bucket. This file is the SINGLE, EXPLICIT policy for *which* output
# files get copied — every file a workflow can write to its S3 results prefix is
# classified here as `transfer: true` or `transfer: false`.
#
# SOURCE OF TRUTH
# The transfer/skip decisions below are transcribed from the authoritative
# "Should Transfer?" file-table list (per workflow: short-read-mngs, long-read-mngs,
# consensus-genome, amr) provided by the team. Where the list's spelling clearly
# disagrees with the real S3 filename it is corrected to match reality (noted
# inline) — matching the actual object key is what makes the copy work.
#
# WITHHELD host-genomic data (still enforced): every file that can carry HOST,
# especially HUMAN, genomic sequence (raw/validated/quality-filtered reads before
# host+human filtering, and host/human-aligned BAMs) is `transfer: false`
# ("PII-adjacent"). This matches the list and is the one hard constraint.
#
# COMPLETENESS CONTRACT
# The enumerator classifies every basename it finds in a run's results prefix:
#   * matches transfer:true   -> copied
#   * matches transfer:false  -> explicitly skipped (on the record)
#   * matches NO entry/pattern -> UNCLASSIFIED -> flagged (logged), never silently
#                                 transferred or dropped.
# So a file that isn't copied is always either an explicit reject or a loud
# "unclassified" signal. Do not add a catch-all.
#
# MATCHING  (first match wins)
#   1. exact basename under the workflow's `files:`
#   2. the workflow's own `patterns:` (glob, in file order)
#   3. the top-level cross-workflow `patterns:` (glob, in file order)
#   4. otherwise :unclassified
# Keys are matched by BASENAME. Verified against staging: the SFN-WDL harness
# flattens WDL output subdirs (assembly/, coverage_viz/) into the results root,
# and results live at samples/<proj>/<sample>/<id>/<workflow>-<major>/. Names that
# differ per workflow (e.g. contigs.fasta transfers for short-read but not
# long-read; sample_validated.fastq transfers for long-read but valid_input does
# not for short-read) are handled by the per-workflow `files:` sections.
#
# VERSIONING
# Version-agnostic (keyed by workflow, not version). Historical-version filename
# drift surfaces as :unclassified rather than being silently transferred/dropped.
# =============================================================================

# Original uploaded reads (input_files.source). WITHHELD: pre-host-filter, the most
# host/human-genomic (PII-adjacent) data in the graph.
raw_inputs:
  transfer: false
  reason: "Original user-uploaded reads; pre-host-filter, host genomic sequence (PII-adjacent)."

# Cross-workflow patterns (lowest precedence). Not in the file-table list; these are
# orchestration/description artifacts, decided here.
patterns:
  "*.description.md":
    transfer: false
    reason: "Per-step description; ingested into the DB (step_description_md). Not a data file."
  "*_status2.json":
    transfer: false
    reason: "SFN-WDL orchestration status file (e.g. _status2.json, genome_status2.json)."
  "*_status.json":
    transfer: false
    reason: "SFN-WDL orchestration status file."

