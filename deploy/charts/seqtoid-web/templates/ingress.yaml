{{- if .Values.ingress.enabled -}}
# Public edge via the AWS Load Balancer Controller (ALB), routed to the ACTIVE
# service so a blueGreen promotion swaps traffic atomically. TLS terminates at the
# ALB using the per-env ACM cert; subnets/extra tuning arrive via ingress.annotations.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "seqtoid-web.fullname" . }}
  labels:
    {{- include "seqtoid-web.labels" . | nindent 4 }}
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
    alb.ingress.kubernetes.io/ssl-redirect: '443'
    alb.ingress.kubernetes.io/healthcheck-path: {{ .Values.ingress.healthCheckPath | quote }}
    {{- /* TLS policy. Emitted by the CHART, not per-env, because the failure mode was a MISSING value:
           with no ssl-policy annotation the AWS Load Balancer Controller applies its own default,
           ELBSecurityPolicy-2016-08, which still permits TLS 1.0 and TLS 1.1. That was found live on
           2026-08-05 on BOTH internet-facing listeners (dev.seqtoid.org and env-staging.seqtoid.org),
           and it was a control LOST in the ECS->EKS migration: the retired ECS ALBs explicitly set
           ELBSecurityPolicy-TLS-1-2-2017-01. Six per-env annotations would have fixed the six envs that
           exist today and silently missed the seventh, so the default belongs here. Overridable per-env
           via ingress.sslPolicy, or wholesale via ingress.annotations (merged after this). */}}
    {{- with .Values.ingress.sslPolicy }}
    alb.ingress.kubernetes.io/ssl-policy: {{ . | quote }}
    {{- end }}
    {{- with .Values.ingress.certificateArn }}
    alb.ingress.kubernetes.io/certificate-arn: {{ . | quote }}
    {{- end }}
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                {{- if eq .Values.rolloutStrategy "pingpong" }}
                # Argo Rollouts rewrites this backend into a weighted ALB action that
                # splits between the ping and pong target groups. port.name must be
                # use-annotation so the AWS LB Controller reads the action annotation.
                name: {{ include "seqtoid-web.fullname" . }}-root
                port:
                  name: use-annotation
                {{- else }}
                name: {{ include "seqtoid-web.fullname" . }}-active
                port:
                  number: {{ .Values.service.port }}
                {{- end }}
    {{- /* Additional hostnames routed to the same active service — e.g. a
           www.<host> vanity host that the app 301-redirects to the apex. Needed so
           the ALB serves them (the cert must already cover them) rather than 404,
           and so the old ECS edge can be retired without breaking those hosts. */}}
    {{- range .Values.ingress.aliasHosts }}
    - host: {{ . | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                {{- if eq $.Values.rolloutStrategy "pingpong" }}
                name: {{ include "seqtoid-web.fullname" $ }}-root
                port:
                  name: use-annotation
                {{- else }}
                name: {{ include "seqtoid-web.fullname" $ }}-active
                port:
                  number: {{ $.Values.service.port }}
                {{- end }}
    {{- end }}
{{- end }}
