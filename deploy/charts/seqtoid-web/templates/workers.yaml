# Worker Deployments — the resque family (workers/scheduler/pipeline-monitor/
# result-monitor) + shoryuken. Each replaces one czecs worker service. `args` go
# to the image ENTRYPOINT, which wraps them in `chamber exec ... bundle exec`.
{{- $root := . -}}
{{- range $name, $w := .Values.workers }}
{{- if ne $w.enabled false }}
{{- /*
  Graceful Resque shutdown (values.yaml workerShutdown): only for workers launched as
  `rake resque:workers`. They run `rake resque:work` directly so the SIGTERM reaches the worker,
  with TERM_CHILD so the in-flight job gets a window to finish.
*/}}
{{- $graceful := and $root.Values.workerShutdown.graceful (eq (join " " $w.args) "rake resque:workers") }}
{{- $grace := $w.terminationGracePeriodSeconds | default $root.Values.workerDrain.terminationGracePeriodSeconds | default $root.Values.gracefulDrain.terminationGracePeriodSeconds | int }}
{{- if $graceful }}
{{- $grace = max $grace (add $root.Values.workerShutdown.preShutdownTimeoutSeconds $root.Values.workerShutdown.termTimeoutSeconds 30) | int }}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "seqtoid-web.fullname" $root }}-{{ $name }}
  labels:
    {{- include "seqtoid-web.labels" $root | nindent 4 }}
    app.kubernetes.io/component: worker
    seqtoid.io/worker: {{ $name }}
spec:
  # `suspend` (cost spin-down) forces every worker to 0 replicas.
  replicas: {{ if $root.Values.suspend }}0{{ else }}{{ default 1 $w.replicaCount }}{{ end }}
  # Default Recreate: most workers are singletons per queue-set, so never run old+new during a roll.
  # A pool that may overlap (the general pool) can opt into a rolling strategy per worker.
  strategy:
    {{- if $w.strategy }}
    {{- toYaml $w.strategy | nindent 4 }}
    {{- else }}
    type: Recreate
    {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "seqtoid-web.name" $root }}
      app.kubernetes.io/instance: {{ $root.Release.Name }}
      app.kubernetes.io/component: worker
      seqtoid.io/worker: {{ $name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "seqtoid-web.name" $root }}
        app.kubernetes.io/instance: {{ $root.Release.Name }}
        app.kubernetes.io/component: worker
        seqtoid.io/worker: {{ $name }}
    spec:
      serviceAccountName: {{ include "seqtoid-web.serviceAccountName" $root }}
      # Resilience (#467a): worker drain. Prefer a per-worker override, then the
      # worker-wide workerDrain default (longer than web's, so a long-running in-flight
      # job finishes on SIGTERM before SIGKILL), falling back to the web grace period.
      # Raised to cover the graceful Resque shutdown window when workerShutdown.graceful is on.
      terminationGracePeriodSeconds: {{ $grace }}
      {{- with $root.Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- /* Per-worker affinity override, else the worker-wide workerAffinity (e.g. keep workers off spot). */}}
      {{- with ($w.affinity | default $root.Values.workerAffinity) }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ $name }}
          image: {{ include "seqtoid-web.image" $root | quote }}
          imagePullPolicy: {{ $root.Values.image.pullPolicy }}
          args:
            {{- if $graceful }}
            - rake
            - resque:work
            {{- else }}
            {{- toYaml $w.args | nindent 12 }}
            {{- end }}
          env:
            {{- include "seqtoid-web.commonEnv" $root | nindent 12 }}
            - name: COUNT
              value: "1"
            {{- if $graceful }}
            - name: TERM_CHILD
              value: "1"
            - name: RESQUE_PRE_SHUTDOWN_TIMEOUT
              value: {{ $root.Values.workerShutdown.preShutdownTimeoutSeconds | quote }}
            - name: RESQUE_TERM_TIMEOUT
              value: {{ $root.Values.workerShutdown.termTimeoutSeconds | quote }}
            {{- end }}
            {{- with $w.queue }}
            - name: QUEUE
              value: {{ . | quote }}
            {{- end }}
            {{- with $w.chamberService }}
            # Per-worker chamber override (Option A: the screening worker uses the screening chamber,
            # not the web chamber). Emitted after commonEnv/extraEnv, so this CHAMBER_SERVICE wins.
            - name: CHAMBER_SERVICE
              value: {{ . | quote }}
            {{- end }}
            {{- if $w.samplesBucket }}
            {{- $bucket := include "seqtoid-web.samplesBucket" $root }}
            {{- with $bucket }}
            - name: SAMPLES_BUCKET_NAME
              value: {{ . | quote }}
            {{- end }}
            {{- end }}
          {{- /*
            Resilience (#467a): workers have no HTTP port, so a wedged worker was
            previously never detected/restarted. Add an exec liveness probe that
            confirms the worker's own process tree is alive (pgrep the args' command
            word), so a crashed/hung supervisor gets the pod restarted. Per-worker
            override via workers.<name>.livenessProbe; default is a process check on
            the first arg (rake / shoryuken). Opt out with livenessProbe: null.
          */}}
          {{- $probeCmd := first $w.args }}
          {{- if hasKey $w "livenessProbe" }}
          {{- with $w.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- else if $root.Values.workerLivenessProbe.enabled }}
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - {{ printf "pgrep -f %s > /dev/null" $probeCmd | quote }}
            initialDelaySeconds: {{ $root.Values.workerLivenessProbe.initialDelaySeconds }}
            periodSeconds: {{ $root.Values.workerLivenessProbe.periodSeconds }}
            timeoutSeconds: {{ $root.Values.workerLivenessProbe.timeoutSeconds }}
            failureThreshold: {{ $root.Values.workerLivenessProbe.failureThreshold }}
          {{- end }}
          resources:
            {{- toYaml (default $root.Values.resources $w.resources) | nindent 12 }}
{{- end }}
{{- end }}
