# The web workload as an Argo Rollouts Rollout (NOT a Deployment).
#
# rolloutStrategy == blueGreen: activeService takes live traffic; previewService fronts
#   the new color for the smoke AnalysisRun before promotion.
# rolloutStrategy == pingpong: canary + ALB weighted target groups. The ping/pong pair
#   keep static selectors (so pod readiness gates inject) and the ALB shifts weight
#   between two target groups instead of an atomic selector flip -- zero-downtime. A
#   single setWeight:100 step preserves the "validate then cut over" behavior. See the
#   rolloutStrategy comment in values.yaml for why blueGreen drops traffic on ALB.
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: {{ include "seqtoid-web.fullname" . }}
  labels:
    {{- include "seqtoid-web.labels" . | nindent 4 }}
spec:
  {{- if .Values.suspend }}
  replicas: 0  # cost spin-down: scale the web Rollout to 0
  {{- else if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      {{- include "seqtoid-web.selectorLabels" . | nindent 6 }}
  strategy:
    {{- if eq .Values.rolloutStrategy "pingpong" }}
    canary:
      pingPong:
        pingService: {{ include "seqtoid-web.fullname" . }}-ping
        pongService: {{ include "seqtoid-web.fullname" . }}-pong
      trafficRouting:
        alb:
          ingress: {{ include "seqtoid-web.fullname" . }}
          servicePort: {{ .Values.service.port }}
          # The ingress backend points at -root (port use-annotation); Argo writes the
          # weighted ALB action that splits between the ping and pong target groups.
          rootService: {{ include "seqtoid-web.fullname" . }}-root
      steps:
        # Single full cutover of an ALREADY-VALIDATED build. The new build is smoke-gated
        # BEFORE this Rollout is ever touched -- the smoke-gate PreSync hook boots the new
        # image and drives in-process requests to the critical paths, and a failure aborts
        # the whole sync so a bad build never reaches this step (see smoke-hook.yaml). So
        # here we only need the zero-downtime cutover: readiness gates hold the new pods
        # NotReady until their ALB target is healthy, then weight shifts 0 -> 100. No
        # atomic flip, so no zero-target window; and because the build was validated at
        # zero user traffic, no user is ever served an unvalidated build.
        - setWeight: 100
    {{- else }}
    blueGreen:
      activeService: {{ include "seqtoid-web.fullname" . }}-active
      previewService: {{ include "seqtoid-web.fullname" . }}-preview
      autoPromotionEnabled: {{ .Values.blueGreen.autoPromotionEnabled }}
      scaleDownDelaySeconds: {{ .Values.blueGreen.scaleDownDelaySeconds }}
      abortScaleDownDelaySeconds: {{ .Values.blueGreen.abortScaleDownDelaySeconds }}
      {{- if .Values.blueGreen.analysis.enabled }}
      # Resilience (#467a): prePromotionAnalysis runs the smoke AnalysisTemplate
      # against the PREVIEW color BEFORE any traffic shift. A failing smoke run
      # aborts the rollout — the active (previous) color keeps serving and the bad
      # preview is scaled down after abortScaleDownDelaySeconds. This holds even when
      # autoPromotionEnabled is true (dev/staging): auto-promotion only fires once the
      # analysis PASSES, so a broken build never auto-promotes. Verified safe 2026-07-06.
      prePromotionAnalysis:
        templates:
          - templateName: {{ include "seqtoid-web.fullname" . }}-smoke
      {{- if .Values.blueGreen.analysis.postPromotion }}
      postPromotionAnalysis:
        templates:
          - templateName: {{ include "seqtoid-web.fullname" . }}-smoke
      {{- end }}
      {{- end }}
    {{- end }}
  template:
    metadata:
      labels:
        {{- include "seqtoid-web.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "seqtoid-web.serviceAccountName" . }}
      terminationGracePeriodSeconds: {{ .Values.gracefulDrain.terminationGracePeriodSeconds }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.topologySpread.enabled }}
      # Availability: keep the replicas off a single node (and best-effort across AZs) so
      # one node/spot loss can't take the whole app down. matchLabelKeys scopes the spread
      # to a single rollout revision (rollouts-pod-template-hash), so during a ping-pong
      # cutover the stable pods and the canary pods spread INDEPENDENTLY -- 4 pods don't
      # need 4 nodes, and DoNotSchedule can't deadlock the surge. The PodDisruptionBudget
      # (pdb.yaml) covers voluntary disruptions; this covers involuntary node loss.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: {{ .Values.topologySpread.hostname.whenUnsatisfiable }}
          matchLabelKeys:
            - rollouts-pod-template-hash
          labelSelector:
            matchLabels:
              {{- include "seqtoid-web.selectorLabels" . | nindent 14 }}
        {{- if .Values.topologySpread.zone.enabled }}
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: {{ .Values.topologySpread.zone.whenUnsatisfiable }}
          matchLabelKeys:
            - rollouts-pod-template-hash
          labelSelector:
            matchLabels:
              {{- include "seqtoid-web.selectorLabels" . | nindent 14 }}
        {{- end }}
      {{- end }}
      {{- if .Values.scratchVolume.enabled }}
      # Chaos-testability (E5 IOChaos): give the pod a REAL mount for its temp writes. See the
      # scratchVolume comment in values.yaml for the full rationale -- in short, IOChaos can only
      # inject a FUSE layer over a volume mount, never over the container's overlay filesystem,
      # so without this the web pod cannot be tested for local-disk faults at all.
      #
      # This init container exists because the kubelet creates an emptyDir mount 0777 root:root
      # with NO sticky bit, and Ruby's Dir.tmpdir refuses a world-writable non-sticky directory --
      # it would fall through to "." (the app root, on the overlay), silently moving every
      # Tempfile off the volume. Creating a private 0700 dir inside the volume and pointing
      # TMPDIR at it keeps the app's behavior identical AND keeps the writes on the mount.
      # Runs as the image's default non-root appuser: the emptyDir is world-writable, so no
      # root and no chmod of the mount point itself is needed.
      initContainers:
        - name: init-scratch
          image: {{ include "seqtoid-web.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - sh
            - -c
            - mkdir -p "$TMPDIR" && chmod 0700 "$TMPDIR"
          env:
            - name: TMPDIR
              value: {{ printf "%s/%s" (trimSuffix "/" .Values.scratchVolume.mountPath) .Values.scratchVolume.tmpdirSubPath | quote }}
          volumeMounts:
            - name: scratch
              mountPath: {{ .Values.scratchVolume.mountPath }}
          resources:
            {{- toYaml .Values.scratchVolume.initResources | nindent 12 }}
      volumes:
        - name: scratch
          emptyDir:
            sizeLimit: {{ .Values.scratchVolume.sizeLimit }}
      {{- end }}
      containers:
        - name: rails
          image: {{ include "seqtoid-web.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # No command/args override: the image ENTRYPOINT (bin/entrypoint.sh) runs
          # `chamber exec idseq-<env>-web -- bundle exec rails server -b 0.0.0.0 -p 3000`.
          ports:
            - name: http
              containerPort: {{ .Values.containerPort }}
          env:
            {{- include "seqtoid-web.commonEnv" . | nindent 12 }}
            {{- if .Values.scratchVolume.enabled }}
            # Point Ruby's Dir.tmpdir at the private 0700 dir the init container made inside
            # the scratch volume. Without this, Dir.tmpdir rejects the world-writable,
            # non-sticky emptyDir mount and falls back to the app root (see values.yaml).
            - name: TMPDIR
              value: {{ printf "%s/%s" (trimSuffix "/" .Values.scratchVolume.mountPath) .Values.scratchVolume.tmpdirSubPath | quote }}
            {{- end }}
          lifecycle:
            preStop:
              exec:
                # Let the Service deregister this pod before it stops accepting conns.
                command: ["sh", "-c", "sleep {{ .Values.gracefulDrain.preStopSleepSeconds }}"]
          readinessProbe:
            httpGet:
              path: {{ .Values.ingress.healthCheckPath }}
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          # Liveness = "is the process wedged / should it be restarted?" -- NOT "are deps healthy?".
          # It targets the SHALLOW /up (static 200, no DB/cache/ES) and is deliberately tolerant, so a
          # transient dependency brownout (which briefly starves the Puma pool) can never trip 6
          # consecutive failures and restart the pod. Readiness (above) stays on the deep /health_check
          # and, if it fails, only pulls the pod from the LB -- no restart (SMP-1473).
          livenessProbe:
            httpGet:
              path: {{ .Values.ingress.livenessPath | default "/up" }}
              port: http
            initialDelaySeconds: 45
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 6
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- if .Values.scratchVolume.enabled }}
          volumeMounts:
            - name: scratch
              mountPath: {{ .Values.scratchVolume.mountPath }}
          {{- end }}
