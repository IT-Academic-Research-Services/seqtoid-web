{{- if .Values.bulkDownload.jobServiceAccount.create -}}
# The bulk-download tar Job's OWN identity. KubeJobClient launches each download as a Job running
# the s3-tar-writer image as ServiceAccount BULK_DOWNLOAD_JOB_SA (app default seqtoid-web-bulk-download,
# which is this SA's default name). Its IRSA role (roleArn) is the least-privilege
# <prefix>-web-<env>-bulk-download-job from the infra repo: read the source buckets, write downloads/*,
# nothing else -- so the tar container never carries the web role's chamber/DB/SES grants.
#
# Before this template the SA was created by hand per env (env-staging 2026-08-04) and untracked, so a
# reconstitute or fresh env silently lost it. Enabling this ADOPTS an existing SA of the same name.
# Plain tracked resource at sync-wave -5, like the app SA (see serviceaccount.yaml for why not a hook).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.bulkDownload.jobServiceAccount.name }}
  labels:
    {{- include "seqtoid-web.labels" . | nindent 4 }}
    app.kubernetes.io/component: bulk-download-job
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
    {{- with .Values.bulkDownload.jobServiceAccount.roleArn }}
    eks.amazonaws.com/role-arn: {{ . | quote }}
    {{- end }}
{{- end }}
