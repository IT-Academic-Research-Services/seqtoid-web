{{- if .Values.screening.enabled }}
{{- $root := . -}}
# Option A: the standalone export-control SCREENING service. Same seqtoid-web image, its OWN deployment
# -- so Descartes never runs in a web request (the web pods delegate to this over HTTP and never block).
# The API server here serves POST /internal/v1/screenings; the async screen + resolution poller run in
# workers.screening. Both use the SCREENING chamber (DESCARTES_RPS_* + the dedicated screening DB), never
# the web chamber. Dark by default (screening.enabled=false); reachable only in-cluster via the Service.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "seqtoid-web.fullname" $root }}-screening
  labels:
    {{- include "seqtoid-web.labels" $root | nindent 4 }}
    app.kubernetes.io/component: screening
spec:
  replicas: {{ if $root.Values.suspend }}0{{ else }}{{ default 1 $root.Values.screening.api.replicaCount }}{{ end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "seqtoid-web.name" $root }}
      app.kubernetes.io/instance: {{ $root.Release.Name }}
      app.kubernetes.io/component: screening
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "seqtoid-web.name" $root }}
        app.kubernetes.io/instance: {{ $root.Release.Name }}
        app.kubernetes.io/component: screening
    spec:
      serviceAccountName: {{ include "seqtoid-web.serviceAccountName" $root }}
      {{- with $root.Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: screening
          image: {{ include "seqtoid-web.image" $root | quote }}
          imagePullPolicy: {{ $root.Values.image.pullPolicy }}
          # The image entrypoint wraps args in `chamber exec $CHAMBER_SERVICE -- bundle exec ...`.
          args: ["rails", "server", "-b", "0.0.0.0", "-p", "{{ $root.Values.screening.api.port }}"]
          ports:
            - name: http
              containerPort: {{ $root.Values.screening.api.port }}
          env:
            {{- include "seqtoid-web.commonEnv" $root | nindent 12 }}
            {{- with $root.Values.screening.chamberService }}
            # Override the web CHAMBER_SERVICE from commonEnv/extraEnv -- last value wins.
            - name: CHAMBER_SERVICE
              value: {{ . | quote }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: {{ $root.Values.ingress.livenessPath | default "/up" }}
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: {{ $root.Values.ingress.livenessPath | default "/up" }}
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            {{- toYaml (default $root.Values.resources $root.Values.screening.api.resources) | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "seqtoid-web.fullname" $root }}-screening
  labels:
    {{- include "seqtoid-web.labels" $root | nindent 4 }}
    app.kubernetes.io/component: screening
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ include "seqtoid-web.name" $root }}
    app.kubernetes.io/instance: {{ $root.Release.Name }}
    app.kubernetes.io/component: screening
  ports:
    - name: http
      port: {{ $root.Values.screening.api.port }}
      targetPort: http
      protocol: TCP
{{- end }}
