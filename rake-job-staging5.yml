---
apiVersion: batch/v1
kind: Job
metadata:
  name: rake-task-job
  namespace: seqtoid-staging
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 864000
  template:
    spec:
      nodeSelector:
        kubernetes.io/arch: amd64
      restartPolicy: Never
      serviceAccountName: czid-staging-seqtoid-web
      containers:
        - name: rails-app
          image: 030998640247.dkr.ecr.us-west-2.amazonaws.com/seqtoid-web:sha-f8415a2f
          command:
            - chamber
            - exec
            - seqtoid-staging-web
            - --
            - bundle
            - exec
            - rake
            - import_user_data[s3://idseq-prod-czi-data-transfer-2026-08-27/user_data_exports/2533/,skip_existing,7,idseq-prod-samples-us-west-2,seqtoid-env-prod-samples]
          env:
            - name: DRY_RUN
              value: false
            - name: RAILS_ENV
              value: staging
            - name: ENVIRONMENT
              value: staging
            - name: RAILS_LOG_TO_STDOUT
              value: yes
            - name: AWS_REGION
              value: us-west-2
            - name: AWS_DEFAULT_REGION
              value: us-west-2
            - name: AWS_ACCOUNT_ID
              value: '030998640247'
            - name: SKIP_RESQUE_SCHEDULE
              value: '1'
