name: ci-test (mysql 8)

# PR test gate for seqtoid-web running the Rails suite against MySQL 8 -- the chosen
# forward database (CZID-281). Runs bin/ci-test, the exact same SSOT script the local
# harness runs (bin/ci-local), so local and CI cannot drift (CZID-109). Self-contained
# (dummy AWS creds + service containers), so it runs in the fork with no cloud access.
# Replaces the former Postgres gate (the Postgres direction was superseded by MySQL 8;
# Postgres lives on in the V1/V3 variants).
#
# CZID-542: the Ruby suite is sharded across SHARD_TOTAL runner jobs (a GitHub Actions
# matrix). Each shard runs only its --only-group slice (balanced by runtime) against its
# own MySQL schema; a final collate job merges the per-shard SimpleCov results into one
# coverage number and runs the promotion regression gate off that collated result. This
# is a follow-up to the in-runner parallel_tests work (parallel_tests caps at a single
# runner's core count, ~2 on ubuntu-latest).

on:
  pull_request:
  push:
    branches: [main]   # gate main post-merge; PR branches are gated via pull_request (avoids a duplicate, concurrency-cancelled run on every PR)
  workflow_dispatch:

# Scope the concurrency group by PR number (or ref for push/dispatch), NEVER by commit SHA.
# A main->integration sync branch points at main's exact HEAD commit, so the push-to-main run
# and the sync PR's pull_request run land on the SAME sha. A sha-keyed group made those two
# collapse into one group and cancel-in-progress killed whichever started second; the cancelled
# run's required contexts then lingered red and blocked the PR forever (a push run and a PR run
# are distinct gates and must never cancel each other). Keying on pull_request.number || github.ref
# keeps the intended dedup -- a new push to the SAME PR/branch still cancels that PR/branch's older
# in-flight run -- while making a PR run and a push run structurally unable to share a group.
concurrency:
  group: ci-test-mysql8-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Shard count. Raised 4 -> 8 (CZID-542 follow-up) once two enabling fixes landed: (1) each shard
  # loads only its OWN schema (bin/ci-test) instead of all N -- so per-shard setup no longer grows with
  # SHARD_TOTAL; (2) the rspec runtime-log cache (restore below + save in collate) makes the split
  # runtime-balanced instead of by filesize, so wall-clock tracks total/N rather than the slowest shard.
  # 8 is the sweet spot: past it the fixed per-shard floor (container init + apt/pip deps ~1.5-2m) starts
  # to dominate and runner cost / flake surface doubles for <1m of wall-clock. Keep in sync with the matrix.
  SHARD_TOTAL: 8

jobs:
  # SMP-1582: skip the duplicated full suite on a main->integration back-sync PR. That branch
  # head IS main's exact HEAD commit, so ci-test already ran (and, if green, posted successful
  # required check runs) on this identical SHA from the push-to-main gate. Re-running the full
  # 8-shard suite + collate on the same SHA is pure duplicated runner cost.
  #
  # FAIL-CLOSED by construction:
  #   (1) Only pull_request events are eligible to skip; push / workflow_dispatch NEVER skip
  #       (the decide step is guarded on github.event_name, so its output stays empty otherwise).
  #   (2) skip=true is emitted ONLY after positively proving that EVERY required ci-test context
  #       (all 8 shards + collate) already concluded "success" on this exact head SHA. Any API
  #       error, missing context, or non-success conclusion leaves skip=false -> full suite runs.
  #   (3) The downstream jobs gate on `!cancelled() && needs.preflight.outputs.skip != 'true'`,
  #       so even an unexpected preflight failure (output empty) still runs the full suite.
  #
  # Required contexts stay GREEN on a skipped run: branch protection evaluates the required
  # status contexts against the PR head SHA, and the earlier push-to-main run already recorded
  # SUCCESS check runs under those exact names on this same commit. Skipping this run therefore
  # either leaves those successes as the latest conclusion, or (if a skipped matrix job posts a
  # "skipped" leg) adds a conclusion that branch protection treats as passing -- never a failure.
  preflight:
    name: Preflight (skip duplicate same-SHA suite)
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.decide.outputs.skip }}
    steps:
      - name: Decide whether this exact SHA already has a green ci-test suite
        id: decide
        # Only PR runs can ever skip; push/dispatch fall through with no output (-> full suite).
        if: ${{ github.event_name == 'pull_request' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          # FAIL-CLOSED: default skip=false; only prove-then-skip. Read-only checks API query.
          set -uo pipefail
          skip=false
          required=(
            "Ruby Test (MySQL 8) shard 1"
            "Ruby Test (MySQL 8) shard 2"
            "Ruby Test (MySQL 8) shard 3"
            "Ruby Test (MySQL 8) shard 4"
            "Ruby Test (MySQL 8) shard 5"
            "Ruby Test (MySQL 8) shard 6"
            "Ruby Test (MySQL 8) shard 7"
            "Ruby Test (MySQL 8) shard 8"
            "Collate coverage + regression gate"
          )
          # Names of completed, SUCCESSFUL check runs on this exact commit. "skipped"/"neutral"
          # conclusions are intentionally NOT accepted -- a skip must be backed by a real green run.
          successes="$(gh api \
            "repos/${GITHUB_REPOSITORY}/commits/${HEAD_SHA}/check-runs?per_page=100" \
            --paginate \
            --jq '.check_runs[] | select(.status == "completed" and .conclusion == "success") | .name' \
            2>/dev/null || true)"
          if [ -z "$successes" ]; then
            echo "No successful check runs found for ${HEAD_SHA} (or API error) -- running full suite."
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          all_present=true
          for ctx in "${required[@]}"; do
            if ! grep -Fxq -- "$ctx" <<< "$successes"; then
              echo "Missing prior green context: ${ctx} -- running full suite."
              all_present=false
            fi
          done
          if [ "$all_present" = "true" ]; then
            skip=true
            echo "All required ci-test contexts already green on ${HEAD_SHA} -- skipping duplicate suite."
          fi
          echo "skip=${skip}" >> "$GITHUB_OUTPUT"

  ruby_test_mysql8:
    name: Ruby Test (MySQL 8) shard ${{ matrix.shard }}
    # SMP-1582: run unless a prior green suite on this exact SHA lets preflight set skip=true.
    # `!cancelled()` keeps this fail-closed -- an errored/empty preflight output still runs.
    needs: preflight
    if: ${{ !cancelled() && needs.preflight.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    # SMP-1579: run each shard in the PREBAKED CI base image instead of bare ruby:3.3.6, so the apt+pip
    # deps (~162s of cold install re-paid by every shard) are already present. The image is FROM
    # ruby:3.3.6 (same Debian/ruby ABI) and sets CI_TEST_PREBAKED=1, which makes bin/ci-test skip the
    # apt/pip groups (and fail-closed if a baked tool is missing). Built + pushed by
    # .github/workflows/ci-test-base-image.yml, which must publish :latest BEFORE this consumes it.
    # The MySQL/redis service containers below are reachable by service name (DB_HOST: db) from a job
    # container exactly as they were under bare ruby:3.3.6 -- the image swap does not change networking.
    # credentials let the shard pull the GHCR package with the built-in token. The package is kept
    # PRIVATE deliberately (a CI base image exposes our build toolchain + dependency versions and has no
    # reason to be public even though this repo's source is). A same-repo push/branch build's GITHUB_TOKEN
    # can read the private package, so internal CI works as-is. Trade-off: an EXTERNAL fork PR gets a
    # read-only token that cannot pull a private org package, so its shards would fail the image pull --
    # acceptable, since fork PRs are not part of the internal flow.
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/it-academic-research-services/seqtoid-web-ci-base:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    strategy:
      # Never cancel sibling shards on one shard's failure -- we want every shard's
      # result (and coverage artifact) so the collate job stays fail-closed rather than
      # merging a partial set.
      fail-fast: false
      matrix:
        # Keep this list in sync with SHARD_TOTAL above.
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    env:
      # Dummy secret -- test only.
      AUTH_TOKEN_SECRET: 'GYbvZ9/uHy75wWWK4BO3jZGJ0noacv7GbTJI96wZgWQ='
      # Connect as root/empty-password -- matches the local CI harness
      # (docker-compose.ci.yml) so privileges (db:drop/create/load) and behavior align.
      DB_USERNAME: root
      DB_PASSWORD: ''
      DB_HOST: db
      RAILS_ENV: test
      AWS_REGION: us-west-2
      AWS_ACCOUNT_ID: test
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      # CZID-542: this shard runs only its --only-group slice (see bin/ci-test).
      SHARD_INDEX: ${{ matrix.shard }}
    services:
      redis:
        image: redis
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      db:
        image: bitnamilegacy/mysql:8.0
        options: >-
          --health-cmd "mysqladmin ping -h localhost"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        env:
          ALLOW_EMPTY_PASSWORD: yes
          MYSQL_DATABASE: idseq_test
          MYSQL_AUTHENTICATION_PLUGIN: mysql_native_password
          # Match the local harness's mysqld flags (docker-compose.ci.yml command:),
          # which GitHub service containers can't pass as a command override.
          MYSQL_EXTRA_FLAGS: "--character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --group_concat_max_len=1073741824"
    steps:
      - name: Check out code
        uses: actions/checkout@v6
      - name: Determine Kernel Version
        run: echo "KERNEL_VERSION=$(uname -r)" >> "$GITHUB_ENV"
      - name: Cache Ruby Dependencies
        uses: actions/cache@v5
        with:
          path: vendor/bundle
          key: ${{ runner.os }}-${{ env.KERNEL_VERSION }}-gems-${{ hashFiles('**/Gemfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ env.KERNEL_VERSION }}-gems
      - name: Restore rspec runtime timing log (enables --group-by runtime balancing)
        # Read-only restore of the merged timing log saved by the previous run's collate job. All
        # shards restore the SAME latest cache (restore-keys prefix), so every shard computes an
        # IDENTICAL runtime-balanced grouping -> the --only-group slices stay a disjoint partition.
        # Cold cache (first run after this lands) -> no file -> bin/ci-test falls back to filesize.
        uses: actions/cache/restore@v5
        with:
          path: tmp/parallel_runtime_rspec.log
          key: rspec-runtime-log-${{ github.run_id }}
          restore-keys: |
            rspec-runtime-log-
      - name: Run CI test suite (shard ${{ matrix.shard }} of ${{ env.SHARD_TOTAL }})
        # SINGLE SOURCE OF TRUTH: bin/ci-test (deps + schema load + rspec) is the exact
        # same script the local harness runs (bin/ci-local). Local and CI can't drift. (CZID-109.)
        # SHARD_INDEX/SHARD_TOTAL select this shard's slice; unset locally = identical serial run.
        # Tee'd so the collate job can sum each shard's RSpec summary; pipefail keeps ci-test's exit
        # authoritative. shell:bash -- the job's default step shell is dash (sh), which lacks pipefail.
        shell: bash
        run: |
          set -o pipefail
          bash bin/ci-test 2>&1 | tee "$RUNNER_TEMP/suite.log"
      - name: Stage shard results
        # Runs even when this shard's tests failed (but not on cancellation), so the
        # collate job still sees this shard's coverage + summary. resultset.json is
        # copied to a non-dot name to avoid upload-artifact's hidden-file skip.
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          mkdir -p shard-out
          cp coverage/.resultset.json shard-out/resultset.json 2>/dev/null || echo '{}' > shard-out/resultset.json
          cp "$RUNNER_TEMP/suite.log" shard-out/suite.log 2>/dev/null || true
          # This shard's slice timings (--runtime-log); the collate job merges all shards' into the
          # full-suite log and re-caches it so the NEXT run's shards split runtime-balanced.
          cp tmp/parallel_runtime_rspec.log shard-out/runtime.log 2>/dev/null || true
      - name: Upload shard results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: shard-results-${{ matrix.shard }}
          path: shard-out/
          retention-days: 1

  collate:
    name: Collate coverage + regression gate
    needs: [preflight, ruby_test_mysql8]
    # Run on success OR a shard's test failure, but not on cancellation. A failed shard
    # already reds the run; collate still produces the collated coverage + regression check.
    # SMP-1582: also stand down when preflight proved a prior green suite on this exact SHA
    # (skip=true) -- the push-to-main run's collate success already covers this commit.
    if: ${{ !cancelled() && needs.preflight.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    container: ruby:3.3.6
    steps:
      - name: Check out code
        uses: actions/checkout@v6
      - name: Install simplecov (standalone -- no app bundle needed to collate)
        # Pin to the Gemfile.lock version so the collated percentage matches the suite.
        shell: bash
        run: gem install simplecov -v 0.22.0 --no-document
      - name: Download shard results
        uses: actions/download-artifact@v4
        with:
          path: shard-artifacts
          pattern: shard-results-*
      - name: Merge shard runtime logs (full-suite timing for next run's balancing)
        # Each shard's --only-group ran a DISJOINT slice, so the per-shard runtime.log fragments
        # together cover the whole suite. Concatenate + dedup by spec path (last wins) into one log.
        shell: bash
        run: |
          mkdir -p tmp
          find shard-artifacts -name runtime.log -exec cat {} + 2>/dev/null \
            | awk -F: 'NF>=2 && $NF ~ /^[0-9.]+$/ { line[$1]=$0 } END { for (k in line) print line[k] }' \
            | sort > tmp/parallel_runtime_rspec.log || true
          echo "merged $(wc -l < tmp/parallel_runtime_rspec.log 2>/dev/null || echo 0) spec timings"
      - name: Save merged runtime log (consumed by the next run's shards)
        # Rotating key (per run) + the shards' restore-keys prefix = shards always pick up the latest.
        if: ${{ !cancelled() }}
        uses: actions/cache/save@v5
        with:
          path: tmp/parallel_runtime_rspec.log
          key: rspec-runtime-log-${{ github.run_id }}
      - name: Collate coverage (fail-closed on a missing shard)
        # Merges every shard's SimpleCov resultset into coverage/.last_run.json and
        # re-applies the whole-suite minimum floor. Exits non-zero if fewer than
        # SHARD_TOTAL resultsets are present -- never merge a partial set.
        shell: bash
        env:
          EXPECTED_SHARDS: ${{ env.SHARD_TOTAL }}
          SHARD_ARTIFACT_DIR: shard-artifacts
        run: ruby bin/collate-coverage
      - name: Aggregate RSpec summary across shards
        shell: bash
        run: ruby bin/aggregate-rspec-summary shard-artifacts "$RUNNER_TEMP/suite.log"

      - name: Fetch regression comparator (platform-harness -- single source of metric truth)
        if: ${{ github.base_ref == 'main' }}
        uses: actions/checkout@v6
        with:
          repository: thorvath-slower/seqtoid-ssot-infra
          ref: integration
          path: .platform-harness-src
          fetch-depth: 1

      - name: Regression gate (baseline delta vs .regression-baseline.json)
        # Only enforced on integration->main promotions. Reads the COLLATED coverage
        # and the summed cross-shard RSpec summary -- catches a suite that silently
        # shrank, coverage that slid, or new failures.
        if: ${{ github.base_ref == 'main' }}
        shell: bash
        run: |
          # container runs as root (no sudo); install jq only if missing.
          command -v jq >/dev/null 2>&1 || { apt-get update -y && apt-get install -y jq; }
          bash .platform-harness-src/platform-harness/bin/regression-compare.sh \
            --baseline .regression-baseline.json \
            --app-log "$RUNNER_TEMP/suite.log" \
            --coverage coverage/.last_run.json
