name: changelog-backfill (manual re-record)

# Manually record a release-notes entry for a component + env -- e.g. to backfill history, re-record a
# deploy the automatic hook missed, or verify the pipeline. It calls the shared record-changelog reusable
# workflow via `uses:` (workflow_call), which is the SAME path the deploy pipelines use: the OIDC token's
# job_workflow_ref resolves to record-changelog.yml, which the writer-role trust admits. Non-blocking and
# no-ops for any env whose ledger bucket + writer role are not provisioned.

on:
  workflow_dispatch:
    inputs:
      env_name:
        description: Environment (dev | staging | prod).
        required: true
        type: choice
        options: [dev, staging, prod]
      component:
        description: Component (web | swipe | pipelines | reference | cli | ssot | workflow-infra).
        required: true
        type: string
      source_repo:
        description: OWNER/REPO to diff for PRs.
        required: false
        type: string
        default: IT-Academic-Research-Services/seqtoid-web
      new_sha:
        description: The shipped commit sha (7-8 hex, or a "sha-<commit>" tag).
        required: true
        type: string
      default_piece:
        description: Force all changes to one piece (single-purpose repos).
        required: false
        type: string
        default: ""
      reason:
        description: Reason (backfill, manual, ...).
        required: false
        type: string
        default: "manual backfill"

permissions:
  id-token: write
  contents: read

jobs:
  backfill:
    uses: ./.github/workflows/record-changelog.yml
    with:
      env_name: ${{ inputs.env_name }}
      component: ${{ inputs.component }}
      source_repo: ${{ inputs.source_repo }}
      new_sha: ${{ inputs.new_sha }}
      default_piece: ${{ inputs.default_piece }}
      reason: ${{ inputs.reason }}
