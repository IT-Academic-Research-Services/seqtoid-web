name: idseq-web security-scan

# App-appropriate security suite for seqtoid-web (CZID-102):
#  - gitleaks: secret scan, gates NEW secrets introduced by a PR (hard-fail)
#  - trivy (fs): dependency CVE scan, ADVISORY (SMP-1638). Surfaces a NEW fixable HIGH/CRITICAL
#    CVE (ignore-unfixed + .trivyignore) as a warning annotation + job summary, but does NOT block
#    the merge into integration or main. CVEs are forward-fixed by the weekly Dependabot PRs
#    (.github/dependabot.yml), not by blocking developer PRs. The post-merge image scan is likewise advisory.
#  - brakeman: Rails static security scan, HARD-FAIL gate (CZID-462 / re-enables the
#    stale C14 TODO). Fails on ANY high-confidence (w3) warning and on any NEW
#    medium-confidence (w2) warning: the 23 inherited w2 findings are pinned in
#    config/brakeman.ignore (baseline logged to #294), so only newly-introduced
#    issues break the build. The old blocker ("re-enable after ruby is upgraded")
#    is resolved — Ruby is now 3.3.6 and Brakeman 6.1.2 is in the Gemfile.
# Note: tflint/checkov are IaC tools and don't apply here (no Terraform).
on:
  pull_request:
  workflow_dispatch:
  # Reusable so the nightly-full-regime.yml orchestrator (#734, #740) can run the same
  # gitleaks/trivy/brakeman gates as the deep-security leg of the overnight regime.
  workflow_call:

permissions:
  contents: read
  pull-requests: read

jobs:
  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 # full history so gitleaks can scan the PR commit range
      - name: gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # gitleaks-action requires a license key for repos owned by an ORGANIZATION (free for
          # personal namespaces -- which is why the thorvath-slower fork's scan passed without it).
          # The action reads env.GITLEAKS_LICENSE; GitHub does NOT auto-inject secrets as env vars,
          # so it must be mapped explicitly or the org scan fails 'missing gitleaks license'. Empty
          # in a personal namespace is harmless (ignored). See platform-overhaul #692.
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          # honors .gitleaks.toml at repo root (dev/test fixture allowlist)

  trivy_fs:
    name: Dependency CVE scan (trivy fs, advisory -- notes new CVEs, does not block)
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v6
      # ADVISORY (was a hard PR gate): a NEW fixable HIGH/CRITICAL not in .trivyignore is SURFACED
      # (warning annotation + job summary) but does NOT fail the check, so it never blocks a merge
      # into integration or main. Rationale: blocking developer PRs on transitive CVEs stalls
      # unrelated work; instead the weekly Dependabot PRs (.github/dependabot.yml) forward-fix them,
      # and security-only Dependabot updates are raised individually + promptly. Semantics still
      # mirror the image gate (ignore-unfixed + .trivyignore) so the note reflects only new, fixable CVEs.
      - name: Trivy filesystem scan
        id: trivy
        continue-on-error: true # ADVISORY: detect (exit-code 1) but never fail the job
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore
          format: table
          output: trivy-fs.txt
          exit-code: '1' # non-zero when a new fixable HIGH/CRITICAL is found; caught by continue-on-error
      - name: Surface findings (advisory note -- never fails the job)
        if: steps.trivy.outcome == 'failure'
        run: |
          {
            echo "### Trivy: new fixable HIGH/CRITICAL CVE(s) found (advisory -- not blocking)"
            echo ""
            echo "These do NOT block the merge. They are forward-fixed by the weekly Dependabot PRs"
            echo "(.github/dependabot.yml); or, if intentionally accepted, add them to .trivyignore with a note."
            echo ""
            echo '```'
            cat trivy-fs.txt 2>/dev/null || echo "(no report file produced)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::warning title=Trivy advisory::New fixable HIGH/CRITICAL CVE(s) found -- see the job summary. Not blocking; fixed via the weekly Dependabot PRs."

  brakeman:
    name: Rails security scan (brakeman, hard-fail on new)
    runs-on: ubuntu-latest
    container: ruby:3.3.6
    steps:
      - name: Check out code
        uses: actions/checkout@v6
      - name: Install brakeman (pinned to Gemfile version)
        # Standalone install (no full bundle) — brakeman is a self-contained static
        # analyzer and doesn't need the app's gems, DB, or built assets to run.
        run: gem install brakeman -v 6.1.2 --no-document
      - name: Brakeman — high-confidence gate (w3, zero tolerance)
        # -z: exit non-zero if ANY warning is reported. Baseline is empty at w3
        # (validated 2026-07-06: 0 warnings, 0 errors), so any new high-confidence
        # finding fails the build.
        run: brakeman --no-pager -w3 -z -q
      - name: Brakeman — medium-confidence gate (w2, fail on NEW only)
        # config/brakeman.ignore pins the 23 inherited medium-confidence findings
        # (CZID-462 / #294). -z + -i means only NEW w2 findings fail the build,
        # ratcheting security forward without forcing a mass-remediation up front.
        run: brakeman --no-pager -w2 -i config/brakeman.ignore -z -q
