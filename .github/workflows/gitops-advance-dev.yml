name: gitops-advance-dev

# CD trigger for the Argo CD blue/green delivery (#444). When a build+push to main
# succeeds (image <repo>:sha-<sha8> in ECR, Trivy+Cosign passed), advance BOTH image.tag
# and image.digest in the DEV env values in cypherid-web-infra. The chart pins by digest
# when one is set (falling back to tag only when it is absent), so advancing the tag alone
# left a stale digest and Argo kept serving the old image while reporting Synced; writing
# both keeps them in lockstep, matching the promote-to-env.yml pattern. Argo CD (dev,
# autoPromotionEnabled: true) then syncs and Argo Rollouts promotes on smoke pass. This
# replaces the czecs deploy for dev -- the app never applies to the cluster directly; it
# just moves a Git pointer.
#
# Chained off the build via workflow_run so it only fires on a *successful* build of
# the exact commit that produced the image.

on:
  workflow_run:
    workflows: ["Build and Push Docker Images"]
    types:
      - completed

concurrency:
  group: gitops-advance-dev
  cancel-in-progress: false

jobs:
  advance:
    # Only on a successful build of main.
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The digest resolution below assumes the dev-account ECR-read role via GitHub OIDC.
      id-token: write
    # SMP-1767: surface whether a NEW digest actually advanced (and which tag) so the auto-gauntlet
    # trigger below fires ONCE per newly-vetted dev digest, not on every no-op re-run.
    outputs:
      changed: ${{ steps.advance.outputs.changed }}
      tag: ${{ steps.advance.outputs.tag }}
      digest: ${{ steps.advance.outputs.digest }}
    env:
      # Same rotatable CI-identity vars the build + promote workflows use, with the DEV-account
      # defaults. Resolve the built image's DIGEST from this account's ECR so the advance can pin it.
      AWS_REGION: us-west-2
      CI_ACCOUNT_ID: ${{ vars.CI_ACCOUNT_ID || '491013321714' }}
      GHA_ROLE: ${{ vars.GHA_ROLE || 'czid-dev-gh-actions-build' }}
      # The ECR repo dev.yaml pins by (image.repository basename). CZID-76 dual-push lands the same
      # manifest here in the dev account, so this account's ECR holds the digest we advance to.
      ECR_REPO_NAME: ${{ vars.ECR_REPO_NAME || 'seqtoid-web' }}
    steps:
      # IT-ARS authenticates gitops writes with a GitHub App (repo var CI_APP_ENABLED=true).
      # The thorvath-slower fork has no app installed, so this step is skipped there and every
      # token below falls back to the GITOPS_TOKEN PAT. See platform-overhaul #683.
      - name: Generate app token
        id: app_token
        if: ${{ vars.CI_APP_ENABLED == 'true' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.GH_ACTIONS_HELPER_APP_ID }}
          private-key: ${{ secrets.GH_ACTIONS_HELPER_PK }}
          owner: ${{ github.repository_owner }}
      - name: Checkout infra (the GitOps values repo)
        uses: actions/checkout@v6
        with:
          repository: ${{ vars.INFRA_REPO || format('{0}/cypherid-web-infra', github.repository_owner) }}
          # IT-ARS: app-minted token; fork: GITOPS_TOKEN PAT (#74) -- scoped write + PR create.
          token: ${{ steps.app_token.outputs.token || secrets.GITOPS_TOKEN }}

      - name: Install yq
        run: |
          YQ=v4.44.3
          curl -fsSL "https://github.com/mikefarah/yq/releases/download/${YQ}/yq_linux_amd64" -o /usr/local/bin/yq
          sudo chmod +x /usr/local/bin/yq

      # Resolve the built image's immutable DIGEST so the advance can pin it alongside the tag.
      # The chart's image helper (seqtoid-web/deploy/charts/seqtoid-web/templates/_helpers.tpl)
      # renders repository@<digest> whenever image.digest is set and ONLY falls back to :tag when
      # it is absent -- so advancing the tag while leaving a stale digest keeps Argo serving the old
      # image while reporting Synced. This job therefore mirrors promote-to-env.yml: write BOTH keys.
      - name: Configure AWS (dev/CI account, ECR read)
        uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d # v6
        with:
          role-to-assume: arn:aws:iam::${{ env.CI_ACCOUNT_ID }}:role/${{ env.GHA_ROLE }}
          role-session-name: gitops-advance-dev-digest
          aws-region: ${{ env.AWS_REGION }}

      - name: Advance dev image (tag + digest) to the built commit
        id: advance
        env:
          BUILT_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          # Match the pushed image tag exactly: bin/push-docker pushes `<repo>:sha-<sha8>`, and the
          # chart renders the readable tag verbatim (no prefix added), so image.tag must be the full
          # `sha-<sha8>`. The chart PINS by image.digest when present, so we resolve + write it too.
          TAG="sha-${BUILT_SHA:0:8}"
          FILE=deploy/argocd/values/seqtoid-web/dev.yaml

          # Immutable digest for this tag, from the dev-account ECR the values pin by. describe-images
          # returns the manifest digest (sha256:...), the exact form the chart renders as repo@<digest>.
          DIGEST="$(aws ecr describe-images \
            --repository-name "$ECR_REPO_NAME" \
            --image-ids "imageTag=$TAG" \
            --query 'imageDetails[0].imageDigest' \
            --output text)"
          case "$DIGEST" in
            sha256:*) : ;;
            *) echo "::error::could not resolve digest for ${ECR_REPO_NAME}:${TAG} in ${CI_ACCOUNT_ID} ECR (got '${DIGEST}'); refusing to advance dev to an unpinnable image."; exit 1 ;;
          esac

          CUR_TAG="$(yq '.image.tag // ""' "$FILE")"
          CUR_DIGEST="$(yq '.image.digest // ""' "$FILE")"
          echo "current tag=$CUR_TAG digest=$CUR_DIGEST"
          echo "new     tag=$TAG digest=$DIGEST"
          # No-op only when BOTH already match; if either drifts, advance both together so the tag and
          # the digest the chart pins by never diverge (the stale-digest bug that stuck dev, #560-adjacent).
          if [ "$CUR_TAG" = "$TAG" ] && [ "$CUR_DIGEST" = "$DIGEST" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "dev already at $TAG ($DIGEST) -- nothing to advance."
            exit 0
          fi
          yq -i ".image.tag = \"$TAG\"" "$FILE"
          yq -i ".image.digest = \"$DIGEST\"" "$FILE"
          {
            echo "changed=true"
            echo "tag=$TAG"
            echo "digest=$DIGEST"
          } >> "$GITHUB_OUTPUT"

      - name: Close stale dev tag-advance PRs (self-cleaning, #560)
        if: steps.advance.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token || secrets.GITOPS_TOKEN }}
          INFRA_REPO: ${{ vars.INFRA_REPO || format('{0}/cypherid-web-infra', github.repository_owner) }}
          KEEP_BRANCH: gitops/advance-dev-${{ steps.advance.outputs.tag }}
        run: |
          set -euo pipefail
          # Each build opens a fresh gitops/advance-dev-<tag> PR that edits dev.yaml. If an
          # earlier advance never merged (red checks, or a human paused it), it lingers as an
          # orphan branch whose dev.yaml edit now conflicts with every newer advance, and they
          # pile up (#560). Before opening the current one, close any still-open advance PRs and
          # delete their branches so at most one dev-advance PR exists at a time. The branch we
          # are about to open (KEEP_BRANCH) is skipped defensively; it does not exist yet here.
          gh pr list --repo "$INFRA_REPO" --state open --json number,headRefName \
            --jq '.[] | select(.headRefName | startswith("gitops/advance-dev-")) | [.number, .headRefName] | @tsv' \
          | while IFS="$(printf '\t')" read -r num br; do
              [ "$br" = "$KEEP_BRANCH" ] && continue
              echo "closing stale dev-advance PR #${num} (${br})"
              gh pr close "$num" --repo "$INFRA_REPO" --delete-branch \
                --comment "Superseded by a newer dev tag-advance; closing to prevent conflicting orphans (#560)."
            done

      - name: Open the tag-advance PR
        if: steps.advance.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token || secrets.GITOPS_TOKEN }}
          TAG: ${{ steps.advance.outputs.tag }}
          DIGEST: ${{ steps.advance.outputs.digest }}
        run: |
          set -euo pipefail
          BRANCH="gitops/advance-dev-${TAG}"
          git config user.name  "seqtoid-gitops"
          git config user.email "gitops@seqtoid.local"
          git checkout -b "$BRANCH"
          git add deploy/argocd/values/seqtoid-web/dev.yaml
          git commit -m "gitops(dev): advance seqtoid-web image -> ${TAG} (${DIGEST})"
          git push -u origin "$BRANCH" --force-with-lease
          gh pr create \
            --title "gitops(dev): advance seqtoid-web -> ${TAG}" \
            --body "Automated dev image-advance from a green seqtoid-web build. Pins BOTH image.tag and image.digest so the chart (which renders repository@<digest> when a digest is set) actually serves the built image. Auto-merges once its checks pass; Argo CD then syncs (dev auto-promotes on smoke pass).

          - image tag: \`${TAG}\`
          - digest: \`${DIGEST}\`
          - source build: ${{ github.event.workflow_run.html_url }}" \
            --base main --head "$BRANCH" || echo "PR may already exist for $BRANCH"

      - name: Auto-merge the dev tag-advance (wait for green, then merge)
        if: steps.advance.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token || secrets.GITOPS_TOKEN }}
          TAG: ${{ steps.advance.outputs.tag }}
          INFRA_REPO: ${{ vars.INFRA_REPO || format('{0}/cypherid-web-infra', github.repository_owner) }}
        run: |
          set -euo pipefail
          BRANCH="gitops/advance-dev-${TAG}"
          REPO="$INFRA_REPO"
          # DEV-ONLY continuous delivery. The image already passed build + Trivy + Cosign before this
          # workflow fired (it is chained off that success), so the tag-advance only moves the dev Git
          # pointer. Wait for the tag-advance PR's own infra checks (validate / tflint / trivy /
          # checkov) to go green, then squash-merge.
          #
          # Poll the PR head commit's check-runs + combined status via the REST API, which needs ONLY
          # checks:read + statuses:read -- both held by the CI app. The previous `gh pr checks --watch`
          # issued a GraphQL statusCheckRollup that traverses checkSuite.workflowRun and ALSO requires
          # actions:read, a scope the app lacks, so every auto-merge died with "Resource not accessible
          # by integration" and left the PR for a human.
          #
          # Rock-solid by construction:
          #   * any REAL check FAILURE -> leave the PR OPEN, never force-merge (fail-safe);
          #   * skipped/neutral checks are not failures and never block;
          #   * a combined-status "pending" with zero classic statuses (GitHub's default) does NOT hang;
          #   * transient GitHub API blips are retried, never failing the rollout on a hiccup;
          #   * the PR lookup and the final merge are retried;
          #   * a hard 20m cap prevents a genuinely stuck check from hanging the job.
          # Staging/prod are NOT auto-advanced (that stays a separate, gated path).
          FAIL='.conclusion=="failure" or .conclusion=="timed_out" or .conclusion=="cancelled" or .conclusion=="action_required" or .conclusion=="startup_failure" or .conclusion=="stale"'
          DEADLINE=$(( $(date +%s) + 1200 ))
          past_deadline() { [ "$(date +%s)" -ge "${DEADLINE}" ]; }

          # Resolve the PR head sha (retry: the PR was opened moments ago in the previous step).
          PR_NUM=""; HEAD_SHA=""
          for _ in $(seq 1 8); do
            if read -r PR_NUM HEAD_SHA < <(gh pr view "$BRANCH" --repo "$REPO" \
                 --json number,headRefOid --jq '"\(.number) \(.headRefOid)"' 2>/dev/null) \
               && [ -n "${HEAD_SHA:-}" ]; then break; fi
            sleep 5
          done
          [ -n "${HEAD_SHA:-}" ] || { echo "::error::could not resolve tag-advance PR for ${BRANCH}."; exit 1; }
          echo "Waiting on checks for tag-advance PR #${PR_NUM} (${HEAD_SHA:0:8}) on ${REPO}..."

          while :; do
            CR="$(gh api "repos/${REPO}/commits/${HEAD_SHA}/check-runs?per_page=100" 2>/dev/null || true)"
            ST="$(gh api "repos/${REPO}/commits/${HEAD_SHA}/status" 2>/dev/null || true)"
            # Transient API failure (empty / non-JSON) -> retry, do NOT fail the deploy.
            if ! jq -e '.check_runs' >/dev/null 2>&1 <<<"$CR" || ! jq -e '.state' >/dev/null 2>&1 <<<"$ST"; then
              past_deadline && { echo "::error::Timed out; checks API kept failing. Leaving PR #${PR_NUM} OPEN."; exit 1; }
              echo "checks API blip; retrying in 20s..."; sleep 20; continue
            fi
            CR_TOTAL="$(jq '.check_runs | length' <<<"$CR")"
            CR_INCOMPLETE="$(jq '[.check_runs[] | select(.status != "completed")] | length' <<<"$CR")"
            CR_FAILED="$(jq "[.check_runs[] | select(${FAIL})] | length" <<<"$CR")"
            ST_STATE="$(jq -r '.state' <<<"$ST")"
            ST_COUNT="$(jq '.total_count' <<<"$ST")"
            if [ "${CR_FAILED}" -gt 0 ] || { [ "${ST_COUNT}" -gt 0 ] && [ "${ST_STATE}" = "failure" ]; }; then
              NAMES="$(jq -r "[.check_runs[] | select(${FAIL}) | .name] | join(\", \")" <<<"$CR")"
              echo "::error::tag-advance PR #${PR_NUM} has failing checks: ${NAMES:-<commit status: failure>}. Leaving it OPEN; not merging."
              exit 1
            fi
            if [ "${CR_TOTAL}" -gt 0 ] && [ "${CR_INCOMPLETE}" -eq 0 ] \
               && { [ "${ST_COUNT}" -eq 0 ] || [ "${ST_STATE}" = "success" ]; }; then
              echo "All ${CR_TOTAL} checks complete, none failing. Merging."
              break
            fi
            past_deadline && { echo "::error::Timed out (20m) waiting for PR #${PR_NUM} checks. Leaving it OPEN; not merging."; exit 1; }
            echo "checks pending (check-runs total=${CR_TOTAL} incomplete=${CR_INCOMPLETE}; status=${ST_STATE}/${ST_COUNT}); retrying in 20s..."
            sleep 20
          done

          # Merge with a short retry (tolerate a transient mergeability/API blip). A persistent failure
          # -- e.g. the app lacking PR-write -- exits non-zero and leaves the PR OPEN, never force-merged.
          merged=""
          for _ in $(seq 1 5); do
            if gh pr merge "${PR_NUM}" --repo "$REPO" --squash --delete-branch; then merged=1; break; fi
            echo "merge attempt failed; retrying in 15s..."; sleep 15
          done
          [ -n "$merged" ] || { echo "::error::could not merge PR #${PR_NUM} after retries (checks were green). Leaving it OPEN."; exit 1; }
          echo "Dev advanced to ${TAG} and merged; Argo CD will sync."

  # SMP-1767: auto-trigger the staging promotion gauntlet for the exact sha that just advanced to dev.
  # This is the "dev deploy went green -> vet it for staging" hop that today is manual (the gauntlet is
  # workflow_dispatch-only). It fires ONCE per newly-vetted digest (advance.changed == 'true'), passing
  # the immutable sha-<commit> tag + the env-staging confirm token the gauntlet's guard requires.
  #
  # OFF BY DEFAULT (vars.STAGING_AUTO_GAUNTLET_ENABLED). Leave it unset until the SMP-1786 gauntlet
  # residuals land -- notably the provision job's GITOPS_TOKEN (bin/gauntlet_env REQUIRES a token to
  # push the candidate element; the gauntlet's provision job does not yet pass one). This trigger is
  # fail-safe regardless: if the gauntlet is disabled or its provision/attest fail for ANY reason, no
  # gauntlet-passed attestation is written, so gitops-promote.yml cannot advance staging (see there).
  # The gauntlet's own STAGING_GAUNTLET_ENABLED master switch must also be on for the dispatched run to
  # do anything, so both are required here to avoid dispatching a no-op run.
  trigger-gauntlet:
    needs: advance
    if: >-
      ${{ vars.STAGING_AUTO_GAUNTLET_ENABLED == 'true'
          && vars.STAGING_GAUNTLET_ENABLED == 'true'
          && needs.advance.result == 'success'
          && needs.advance.outputs.changed == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write # dispatch the gauntlet's workflow_dispatch in this same repo
    steps:
      - name: Dispatch staging-gauntlet for the freshly-vetted dev sha
        env:
          # workflow_dispatch via GITHUB_TOKEN DOES create a run (the recursion guard exempts
          # workflow_dispatch); prefer the GITOPS_TOKEN PAT when present for parity with the other
          # gitops hops, else fall back to the job token (needs the actions: write above).
          GH_TOKEN: ${{ secrets.GITOPS_TOKEN || github.token }}
          TAG: ${{ needs.advance.outputs.tag }}
        run: |
          set -euo pipefail
          case "$TAG" in
            sha-[0-9a-f]*) : ;;
            *) echo "::error::refusing to dispatch gauntlet for a non sha-<commit> tag ('$TAG')"; exit 1 ;;
          esac
          echo "auto-triggering staging promotion gauntlet for ${TAG} (advanced to dev this run)"
          gh workflow run staging-gauntlet.yml \
            --repo "${GITHUB_REPOSITORY}" \
            --ref main \
            -f sha="${TAG}" \
            -f confirm_target=env-staging.seqtoid.org

  # Sentry release + dev deploy tracking (CZID-552) + frontend source-map upload (SMP-1826).
  # Runs on the same successful main build as the advance above, keyed to the exact commit
  # that produced the image. Creates a Sentry release, associates commits (suspect commits),
  # records a dev deploy, and uploads the frontend source maps EXTRACTED FROM THE BUILT IMAGE
  # so Sentry can symbolicate minified frames (e.g. vendors.bundle.min.js:205) back to source.
  #
  # DEV-ONLY: this workflow only fires for main builds and hard-codes -e dev. It reads the DEV
  # frontend project from the dev-scoped vars.SENTRY_PROJECT (the job's `environment: dev` above).
  # PR previews are pull_request builds and never reach this job (the main-only `if`), so they are
  # excluded by construction -- no per-preview guard needed. staging/prod uploads are mirrored in
  # promote-to-env.yml (their own gated tiers + their own env-scoped SENTRY_PROJECT), SMP-1855 -- do
  # NOT broaden this job to those envs here.
  #
  # Isolated from `advance`: separate job, no needs/dependency, so a Sentry API hiccup or an
  # unprovisioned secret can NEVER block the dev rollout. The source-map upload additionally
  # runs continue-on-error (warn, never block -- the deploy already happened) but surfaces any
  # failure LOUDLY (::error:: annotation + job summary) so a broken upload can't rot unnoticed.
  sentry-release:
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    # SMP-1855: bind this job to the dev GitHub Environment so vars.SENTRY_PROJECT resolves to the
    # environment-scoped value (the dev frontend project) rather than the repo-level default. Staging
    # and prod uploads run from promote-to-env.yml, which is already environment-scoped per tier, and
    # each reads its OWN vars.SENTRY_PROJECT -- so all three tiers upload to the correct project with
    # no per-env workflow branching. dev has no protection rules, so this bind is a no-op on gating.
    environment: dev
    permissions:
      contents: read
      id-token: write # OIDC assume-role to pull the built image from ECR (SMP-1826)
    env:
      # Provision these in the seqtoid-web repo before this does anything (ops half of
      # CZID-552 / SMP-1826). Until ALL THREE are set, every step below self-skips GREEN:
      #   SENTRY_AUTH_TOKEN (secret) -- MUST carry `project:releases` AND `org:read`. The
      #     sourcemap upload needs both; a release-creation-only token creates the release
      #     fine and then 403s on `sourcemaps upload`. (release creation alone = project:releases)
      #   SENTRY_ORG     (var) = ucsf-rm  -- one org; stays repo-level.
      #   SENTRY_PROJECT (var) -- the DEV FRONTEND project (maps are a frontend artifact; NOT the
      #     rails/backend project). SMP-1855 made this ENVIRONMENT-scoped: set it on the `dev` GitHub
      #     Environment (dev-reactjs-project). The `environment: dev` on this job resolves it here.
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_ORG: ${{ vars.SENTRY_ORG }}
      SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
      SENTRY_CLI_VERSION: "2.33.1"
      BUILT_SHA: ${{ github.event.workflow_run.head_sha }}
      # ECR (dev account) coordinates to pull the built image and extract *.map. The image
      # lives in ECR, NOT GHCR -- builds push to <acct>.dkr.ecr.<region>.amazonaws.com/idseq-web.
      # Mirrors build-docker-image.yml (same account/region/role).
      CI_ACCOUNT_ID: ${{ vars.CI_ACCOUNT_ID || '491013321714' }}
      AWS_REGION: us-west-2
      GHA_ROLE: ${{ vars.GHA_ROLE || 'czid-dev-gh-actions-build' }}
    steps:
      - name: Checkout seqtoid-web at the built commit (full history for suspect commits)
        uses: actions/checkout@v6
        with:
          # This job's default repo is seqtoid-web (no repository: override), unlike the
          # advance job which checks out the infra repo. Full history + the exact built
          # ref is what `sentry-cli releases set-commits --auto` needs to compute the
          # commit range for suspect commits.
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Register Sentry release + dev deploy for the built commit
        run: |
          set -euo pipefail
          if [ -z "${SENTRY_AUTH_TOKEN:-}" ] || [ -z "${SENTRY_ORG:-}" ] || [ -z "${SENTRY_PROJECT:-}" ]; then
            echo "Sentry CD credentials not provisioned (need SENTRY_AUTH_TOKEN secret + SENTRY_ORG/SENTRY_PROJECT vars)."
            echo "Skipping Sentry release/deploy tracking -- see SMP-1826 ops steps. This is not a failure."
            exit 0
          fi
          # Release name == the 8-char commit SHA. This is exactly the value baked into
          # the image as GIT_VERSION (backend config.release) and GIT_RELEASE_SHA
          # (frontend Sentry.init release), so runtime events on both tiers tag to the
          # release we register here -- and the source maps below upload to this SAME
          # release, so events and maps share the one 8-char SHA (no mismatch).
          RELEASE="${BUILT_SHA:0:8}"
          echo "Registering Sentry release ${RELEASE} (org=${SENTRY_ORG} project=${SENTRY_PROJECT})"

          # Pinned sentry-cli install (matches the pinned-yq/pinned-tool convention in
          # this repo -- no floating "latest"). The get-cli script honors SENTRY_CLI_VERSION.
          curl -sSfL https://sentry.io/get-cli/ | INSTALL_DIR=/usr/local/bin bash

          sentry-cli releases new "$RELEASE"
          # Suspect commits: --auto uses the checked-out git history + the Sentry repo
          # integration to associate the commit range since the previous release.
          sentry-cli releases set-commits "$RELEASE" --auto
          sentry-cli releases finalize "$RELEASE"
          # Record the dev deploy for this release so Sentry knows what shipped to dev
          # and can resolve-in-next-release / window regressions correctly.
          sentry-cli releases deploys "$RELEASE" new -e dev
          echo "Sentry release ${RELEASE} finalized + dev deploy recorded."

      # OIDC assume-role so the upload step can pull the built image from ECR (SMP-1826).
      # Gated on the Sentry vars so an unprovisioned deployment self-skips cleanly (no role
      # assumed) exactly like the release step above.
      # PREREQUISITE (IAM, lives in AWS/infra, NOT verifiable from this repo): the GHA_ROLE
      # trust policy must permit THIS job -- which is workflow_run-triggered, so its OIDC
      # subject differs from the build job's -- to assume it. The build role is referenced for
      # convenience; its trust for this job is UNVERIFIED. If it cannot be assumed, the pull
      # fails and the "Surface" step below flags it (non-blocking).
      - name: Configure AWS credentials (OIDC) to pull the built image from ECR
        if: ${{ vars.SENTRY_ORG != '' && vars.SENTRY_PROJECT != '' }}
        uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d # v6
        with:
          role-to-assume: arn:aws:iam::${{ env.CI_ACCOUNT_ID }}:role/${{ env.GHA_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      # SMP-1826: upload the frontend source maps for THIS release. The .map files exist only
      # INSIDE the built image (webpack devtool: source-map, emitted in the Docker builder
      # stage) -- never in the build context and never on this runner -- so we pull the exact
      # image from ECR and extract them. continue-on-error: a failed upload must NOT fail this
      # (deploy-decoupled) job; the "Surface" step below makes any failure loud instead.
      #
      # KNOWN OPEN RISK (SMP-1826): deployed dev serves Sprockets digest-suffixed names
      # (vendors.debug-<64hex>.js), while the artifacts uploaded here are the raw webpack names
      # (vendors.bundle.min.js). Whether Sentry's `~/` matching ignores the digest is DOCUMENTED,
      # NOT OBSERVED -- if it compares full filenames, upload succeeds but traces stay minified.
      # Verify on the first deploy with `sentry-cli sourcemaps explain <event-id>` (see commit msg).
      - name: Upload frontend source maps to Sentry (extracted from the built image)
        id: sourcemaps
        continue-on-error: true
        run: |
          set -euo pipefail
          if [ -z "${SENTRY_AUTH_TOKEN:-}" ] || [ -z "${SENTRY_ORG:-}" ] || [ -z "${SENTRY_PROJECT:-}" ]; then
            echo "Sentry CD credentials not provisioned -- skipping source-map upload. This is not a failure."
            exit 0
          fi
          RELEASE="${BUILT_SHA:0:8}"

          # sentry-cli was installed to /usr/local/bin by the previous step; it persists across
          # steps on the same runner. Re-install defensively only if missing.
          command -v sentry-cli >/dev/null 2>&1 || curl -sSfL https://sentry.io/get-cli/ | INSTALL_DIR=/usr/local/bin bash

          # Extract the webpack dist (bundles + maps) from the exact built image. The image is
          # in ECR (NOT GHCR): builds push <acct>.dkr.ecr.<region>.amazonaws.com/idseq-web at
          # tag sha-<sha8> (see build-docker-image.yml). That is the SAME 8-char SHA as $RELEASE,
          # so the extracted maps match the release. docker create + cp only -- the container is
          # NEVER started, so no entrypoint / DB / secrets run.
          REGISTRY="${CI_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          REF="${REGISTRY}/idseq-web:sha-${RELEASE}"
          echo "Extracting source maps from ${REF}"
          aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$REGISTRY"
          docker pull "$REF"
          cid="$(docker create "$REF")"
          rm -rf ./dist-maps
          docker cp "${cid}:/app/app/assets/dist" ./dist-maps
          docker rm "$cid" >/dev/null

          # Empty-extraction guard (SMP-1826 item 3): a webpack/devtool/build change could stop
          # emitting .map files. Uploading zero artifacts would exit 0 and look fine -- fail
          # LOUDLY instead of silently shipping a release with no maps.
          mapcount="$(find ./dist-maps -type f -name '*.map' 2>/dev/null | wc -l | tr -d ' ')"
          echo "Found ${mapcount} .map file(s) in ${REF}."
          if [ "${mapcount}" = "0" ]; then
            echo "::error title=Sentry source-map upload::NO .map files in the built image (${REF}). Nothing to upload -- release ${RELEASE} will have NO source maps. Check webpack devtool / the asset build."
            exit 1
          fi

          # Upload to the SAME release. sentry-cli reads SENTRY_ORG / SENTRY_PROJECT /
          # SENTRY_AUTH_TOKEN from the job env. A token missing project:releases 403s here
          # (non-zero, loud) -- it does NOT silently no-op.
          sentry-cli sourcemaps upload --release "$RELEASE" ./dist-maps

          # Verify the artifacts actually landed on the release rather than trusting exit 0
          # (SMP-1826 item 2). Zero .map artifacts on the release == effective failure.
          filecount="$(sentry-cli releases files "$RELEASE" list 2>/dev/null | grep -c '\.map' || true)"
          echo "Sentry release ${RELEASE} now lists ${filecount} .map artifact(s)."
          if [ "${filecount}" = "0" ]; then
            echo "::error title=Sentry source-map upload::Upload exited 0 but release ${RELEASE} lists 0 .map artifacts (token scope? org/project mismatch?)."
            exit 1
          fi
          echo "Uploaded ${mapcount} .map file(s) to release ${RELEASE}; ${filecount} confirmed on the release."

      # Make a failed/empty upload VISIBLE (SMP-1826 item 1): continue-on-error keeps the job
      # green, so on its own a broken upload is easy to miss. `outcome` is the step result
      # BEFORE continue-on-error is applied, so this reliably catches real failures (exit 1)
      # while treating a clean credentials-skip (exit 0) as success. Emits a run-level ::error::
      # annotation (red banner on the run page) + a job-summary block a person scanning the
      # Actions tab will spot.
      - name: Surface source-map upload result
        if: always()
        run: |
          set -euo pipefail
          OUTCOME="${{ steps.sourcemaps.outcome }}"
          RELEASE="${BUILT_SHA:0:8}"
          if [ "${OUTCOME}" = "failure" ]; then
            echo "::error title=Sentry source-map upload FAILED::Release ${RELEASE} may have NO usable source maps -- Sentry will show minified frames. See the 'Upload frontend source maps to Sentry' step log."
            {
              echo "### ❌ Sentry source-map upload FAILED for release \`${RELEASE}\`"
              echo ""
              echo "The dev deploy was **not** blocked, but Sentry may show **minified frames** for this release."
              echo "Open the **Upload frontend source maps to Sentry** step log above for the cause (empty extraction, token scope, or org/project mismatch)."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Sentry source-map step outcome: ${OUTCOME} (upload succeeded, or a clean credentials-skip)."
            echo "### ✅ Sentry source-map step: \`${OUTCOME}\` for release \`${RELEASE}\`" >> "$GITHUB_STEP_SUMMARY"
          fi
