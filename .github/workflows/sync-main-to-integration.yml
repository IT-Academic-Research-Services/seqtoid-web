name: Sync main -> integration

# Keeps `integration` from silently rotting behind `main`.
#
# promote-integration-to-main rolls integration -> main, but NOTHING ever brought main back down to
# integration. So every commit that reached main WITHOUT going through integration -- a hotfix via
# workflow_dispatch (an explicitly supported path, #289/#290), or infra/CI work merged direct -- left
# integration permanently behind, and the gap only ever grew. It was found 18 commits behind with zero
# commits of its own. Consequences, all quiet:
#   - a feature branched off main and PR'd into integration carries the whole backlog in its diff, and
#     the preview sandbox then BUILDS that -- so the author is not reviewing their change in isolation;
#   - a feature branched off integration is developed and tested against stale code;
#   - roll-up conflicts accumulate the longer the drift persists.
# Every roll-up merge commit also lands on main and not integration, so the drift restarts immediately
# even in the happy path. Tracked in the platform-overhaul back-sync ticket (Forgejo 691).

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: sync-main-to-integration
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    # Do not run on forks of this repo. Gated on a repo VARIABLE rather than a hardcoded
    # `github.repository == 'org/repo'` string: that pattern is what makes the trunk workflows
    # silently no-op in the UCSF org (#692). Set TRUNK_SYNC_ENABLED=true on the canonical repo only.
    if: ${{ vars.TRUNK_SYNC_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Generate app token
        id: app_token
        if: ${{ vars.CI_APP_ENABLED == 'true' }}
        uses: chanzuckerberg/github-app-token@365b1f2db827eb8f17288ec335b1a7e3c03ff683 # v1.1.4
        with:
          app_id: ${{ secrets.GH_ACTIONS_HELPER_APP_ID }}
          private_key: ${{ secrets.GH_ACTIONS_HELPER_PK }}

      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ steps.app_token.outputs.token || secrets.GITOPS_TOKEN || github.token }}
          persist-credentials: true

      - name: Sync integration up to main
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token || secrets.GITOPS_TOKEN || github.token }}
        run: |
          set -euo pipefail
          git config user.name  "seqtoid-gitops"
          git config user.email "gitops@seqtoid.local"
          git fetch origin main integration

          if git merge-base --is-ancestor origin/main origin/integration; then
            echo "integration already contains main -- nothing to do."
            exit 0
          fi

          # NO-OP GUARD: main can be AHEAD of integration by commits that change no files -- most
          # commonly the merge commit that promote-integration-to-main lands on main during the
          # nightly promote round-trip. The trees are then identical, so there is nothing to sync;
          # without this the fast-forward push gets rejected by branch protection and the fallback
          # opens a PR with a 0-file diff that sits open until someone closes it. If the working
          # trees match, stop here as a clean no-op rather than open (or leave) an empty PR.
          if git diff --quiet origin/main origin/integration; then
            echo "main and integration have identical trees -- nothing to sync (no-op)."
            exit 0
          fi

          # Lossless fast-forward: integration has NO commits of its own, so it can simply advance.
          if git merge-base --is-ancestor origin/integration origin/main; then
            echo "integration is strictly behind main -- fast-forwarding."
            if git push origin "origin/main:integration"; then
              echo "integration fast-forwarded to $(git rev-parse --short origin/main)."
              exit 0
            fi
            echo "::warning::fast-forward push was rejected (branch protection). Opening a PR instead."
          else
            # DIVERGED: integration carries feature commits not yet rolled up, AND main carries commits
            # integration lacks. A fast-forward would DROP the feature commits, so it must not be used.
            echo "integration has diverged from main -- opening a merge PR instead of forcing."
          fi

          # Fallback that never loses work: propose the sync as a reviewable PR.
          BRANCH="gitops/sync-integration-$(git rev-parse --short origin/main)"
          git checkout -B "$BRANCH" origin/integration
          if ! git merge --no-edit origin/main; then
            git merge --abort || true
            echo "::error::main -> integration does not merge cleanly. A human must reconcile it."
            gh issue create \
              --title "integration has drifted from main and no longer merges cleanly" \
              --body "The automated main -> integration sync could not merge. \`integration\` must be reconciled by hand before the next roll-up, or the drift will keep growing. Tracked in the platform-overhaul back-sync ticket (Forgejo 691)." \
              || true
            exit 1
          fi
          # Belt-and-suspenders: never open an EMPTY PR. If the merged (local) branch has no file
          # diff against integration -- e.g. it only pulled in no-op merge commits -- there is
          # nothing to review, so stop before pushing the branch or opening a PR. The early
          # tree-identity guard above catches the common case; this covers the diverged path too.
          if git diff --quiet origin/integration "$BRANCH"; then
            echo "synced branch has no file changes vs integration -- skipping PR (no-op)."
            exit 0
          fi

          # The branch name is derived from the main SHA, so a RERUN at the same SHA targets a branch
          # that may already exist remotely from an earlier attempt. A plain push is then rejected
          # non-fast-forward ("tip of your current branch is behind its remote counterpart"), set -e
          # kills the job, and the sync silently never lands -- which is exactly how seven of these
          # PRs stacked up. The branch is a disposable bot branch regenerated from
          # (integration + main) every run and nobody develops on it, so overwriting it is correct;
          # --force-with-lease keeps that honest by refusing if the remote moved unexpectedly.
          if ! git push --force-with-lease -u origin "$BRANCH"; then
            echo "::error::could not push $BRANCH even with --force-with-lease. The remote branch moved unexpectedly; delete it and re-run."
            exit 1
          fi
          gh pr create --base integration --head "$BRANCH" \
            --title "sync: bring integration up to main" \
            --body "Automated back-sync. integration was behind main; without this it keeps drifting and every feature PR into integration carries the backlog in its diff. Tracked in the platform-overhaul back-sync ticket (Forgejo 691)." \
            || echo "a sync PR may already be open"

          # Self-complete the back-sync so these PRs CONVERGE instead of piling up behind the
          # integration review rule. The synced content is by definition ALREADY on main --
          # reviewed on the way in, or an approved direct-to-main hotfix -- so it does not need a
          # fresh review on the way back down.
          #
          # The durable review bypass is now IN PLACE: the CI app (seqtoid-ci-app) is a pull-request
          # review bypass actor on integration and integration requires 0 reviews, so NO human
          # approval is needed for this PR to merge. Two completion paths, tried in order:
          #   1. --admin: an immediate merge. It only succeeds where the app can override branch
          #      protection outright -- i.e. it is a repo admin or a full ruleset bypass actor on
          #      integration. This app holds only contents:write + pull-requests:write (NOT
          #      administration), so on a branch guarded by CLASSIC branch protection this call is
          #      EXPECTED to fail; that is not an error, it just means path 2 is taken.
          #   2. --auto: arm auto-merge. GitHub then merges the PR on its own the moment the required
          #      security checks pass (~1-2 min), with no human, because the review requirement is
          #      already satisfied by the bypass above.
          #
          # THIS STEP MUST FAIL THE JOB IF THE PR DOES NOT ACTUALLY MERGE. Arming auto-merge is NOT
          # success: a bare `echo merged` right after --auto reports the job GREEN while the PR is
          # still only QUEUED, so a back-sync that never lands (e.g. a required check fails) stays
          # invisible and integration silently drifts behind main -- the exact pileup this self-merge
          # exists to prevent. So after arming, WAIT for the PR to reach MERGED and only then report
          # success; on a closed-unmerged PR or a timeout, go RED so the drift is loud.
          PRNUM="$(gh pr list --head "$BRANCH" --base integration --state open --json number --jq '.[0].number // empty' || true)"
          if [ -z "$PRNUM" ]; then
            # The PR was pushed and `gh pr create` ran, so one must exist. Finding none means the
            # create failed for a reason its `|| echo` swallowed. Do not exit 0 on this path: that
            # is the same silent-success hole in a different place.
            echo "::error::pushed $BRANCH but no open sync PR into integration could be found. The PR was not created; integration is still behind main."
            {
              echo "### Back-sync FAILED"
              echo "Pushed \`$BRANCH\` but no open sync PR into \`integration\` exists."
              echo "\`integration\` is still behind \`main\`."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          MERGE_LOG="$(mktemp)"
          if gh pr merge "$PRNUM" --merge --admin --delete-branch >"$MERGE_LOG" 2>&1; then
            echo "sync PR #$PRNUM merged immediately (admin/full bypass)."
          elif gh pr merge "$PRNUM" --merge --auto --delete-branch >>"$MERGE_LOG" 2>&1; then
            echo "auto-merge armed on sync PR #$PRNUM; the app has no admin override here, so waiting for the required checks to pass and GitHub to merge it (no human needed)."
          else
            # Neither an immediate admin merge nor arming auto-merge worked. Surface the real reason;
            # the gh output is what tells you whether this is the review rule, a failing required
            # check, auto-merge being disabled on the repo, or something new.
            echo "----- gh pr merge output -----"
            cat "$MERGE_LOG"
            echo "------------------------------"
            echo "::error::sync PR #$PRNUM could neither be merged nor armed for auto-merge; integration is STILL behind main. See the merge output above for the reason."
            {
              echo "### Back-sync FAILED"
              echo "Sync PR #$PRNUM was opened but could not be merged or armed for auto-merge, so \`integration\` is **still behind \`main\`**."
              echo ""
              echo '```'
              cat "$MERGE_LOG"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          # Arming auto-merge is not the same as merging. Wait for the PR to actually reach MERGED
          # before reporting success. Budget ~8 min (32 * 15s): the security suite (checkov is the
          # slow one, ~1.5 min) must finish before auto-merge fires. Exit GREEN the instant it
          # merges; go RED on a closed-unmerged PR or on timeout, so a stuck back-sync is loud.
          for _ in $(seq 1 32); do
            PR_STATE="$(gh pr view "$PRNUM" --json state --jq .state 2>>"$MERGE_LOG" || true)"
            if [ "$PR_STATE" = "MERGED" ]; then
              echo "sync PR #$PRNUM merged; integration is up to date with main."
              exit 0
            fi
            if [ "$PR_STATE" = "CLOSED" ]; then
              echo "::error::sync PR #$PRNUM was CLOSED without merging; integration is STILL behind main."
              {
                echo "### Back-sync FAILED"
                echo "Sync PR #$PRNUM was closed without merging, so \`integration\` is **still behind \`main\`**."
              } >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
            sleep 15
          done
          echo "----- required checks on sync PR #$PRNUM -----"
          gh pr checks "$PRNUM" || true
          echo "::error::sync PR #$PRNUM did not merge within the wait budget; integration may still be behind main. A required check is likely failing or stuck -- see the checks above."
          {
            echo "### Back-sync did NOT converge in time"
            echo "Auto-merge was armed on sync PR #$PRNUM but it had not merged within ~8 minutes, so \`integration\` may still be **behind \`main\`**. Check that PR's required checks."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1
