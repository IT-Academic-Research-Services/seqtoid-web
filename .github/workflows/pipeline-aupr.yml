name: Pipeline E2E + AUPR gate

# Reusable pipeline-E2E + AUPR tier (platform-overhaul #737). Dispatches the CI-native viral
# benchmark on seqtoid-workflows (short-read-mngs-viral-benchmarks.yml), polls it to completion, and
# fails if that run's AUPR gate (harvest.py --min-aupr, driven by SHORT_READ_MNGS_MIN_AUPR on that
# repo) trips. It does NOT define a new benchmark -- it drives the one that already exists.
#
# EXPENSIVE + cross-repo: the CALLER guards this (an `if:` on an enable var) and passes
# `secrets: inherit` so this workflow can read secrets.WORKFLOWS_DISPATCH_TOKEN (a token with
# actions:write to dispatch + actions:read to poll on seqtoid-workflows). Extracted from
# nightly-full-regime.yml so the nightly regime and the staging gauntlet share one definition.
#
# DEEPER VARIANT (real AWS, NOT wired here -- documented for the #737 follow-up): the app-native gate
# runs the benchmark through the deployed SFN + Batch + S3 + ECR pipeline. The dispatch
# (SfnBenchmarkPipelineDispatchService -> BenchmarkWorkflowRun) and AUPR computation
# (BenchmarkMetricsService, nt_aupr/nr_aupr) already exist in-app; what is missing is a
# `taxonomy:benchmark_gate[0.98]` rake that dispatches, polls, and asserts AUPR >= 0.98.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      # Cross-repo target for the CI-native viral benchmark + the AUPR floor we expect it to enforce.
      WORKFLOWS_REPO: IT-Academic-Research-Services/seqtoid-workflows
      BENCHMARK_WORKFLOW: short-read-mngs-viral-benchmarks.yml
      BENCHMARK_REF: integration
      EXPECTED_MIN_AUPR: '0.98'
    steps:
      - name: Preconditions
        env:
          # Needs actions:write on seqtoid-workflows to dispatch + actions:read to poll. A missing
          # token is a hard, explicit failure (not a silent green) so an enabled-but-unconfigured
          # regime is obvious in the report.
          WORKFLOWS_DISPATCH_TOKEN: ${{ secrets.WORKFLOWS_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${WORKFLOWS_DISPATCH_TOKEN}" ]; then
            echo "::error::this tier is enabled but secrets.WORKFLOWS_DISPATCH_TOKEN is unset."
            echo "It dispatches the ${BENCHMARK_WORKFLOW} benchmark on ${WORKFLOWS_REPO}; it needs a"
            echo "token with actions:write (dispatch) + actions:read (poll) on that repo. Also set"
            echo "SHORT_READ_MNGS_MIN_AUPR=${EXPECTED_MIN_AUPR} on ${WORKFLOWS_REPO} so its harvest.py AUPR gate bites."
            exit 1
          fi
          echo "Preconditions OK -- will dispatch ${BENCHMARK_WORKFLOW} on ${WORKFLOWS_REPO}@${BENCHMARK_REF}."

      - name: Dispatch viral benchmark + gate on its AUPR result
        env:
          GH_TOKEN: ${{ secrets.WORKFLOWS_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          # Timestamp BEFORE dispatch so we can identify the run we just started (gh workflow run does
          # not return a run id). Dispatching this workflow forces a full benchmark run (its has-diff
          # job treats workflow_dispatch as a full-run trigger).
          since="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          gh workflow run "${BENCHMARK_WORKFLOW}" --repo "${WORKFLOWS_REPO}" --ref "${BENCHMARK_REF}"

          echo "Dispatched; locating the run created at/after ${since}..."
          run_id=""
          for _ in $(seq 1 12); do
            sleep 10
            run_id="$(gh run list --repo "${WORKFLOWS_REPO}" --workflow "${BENCHMARK_WORKFLOW}" \
              --event workflow_dispatch --created ">=${since}" --limit 1 --json databaseId \
              --jq '.[0].databaseId // empty')"
            [ -n "${run_id}" ] && break
          done
          if [ -z "${run_id}" ]; then
            echo "::error::Could not locate the dispatched ${BENCHMARK_WORKFLOW} run on ${WORKFLOWS_REPO}."
            exit 1
          fi

          echo "Watching ${WORKFLOWS_REPO} run ${run_id} to completion (AUPR gate is enforced inside it)..."
          # --exit-status makes gh return non-zero if the run concluded failure -- i.e. if the viral
          # benchmark's harvest.py --min-aupr gate (SHORT_READ_MNGS_MIN_AUPR) tripped, this leg goes red.
          gh run watch "${run_id}" --repo "${WORKFLOWS_REPO}" --exit-status --interval 30
          echo "Pipeline E2E benchmark run ${run_id} passed (AUPR gate included)."
