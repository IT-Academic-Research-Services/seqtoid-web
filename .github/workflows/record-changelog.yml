name: record-changelog (append a deploy to the notes ledger)

# Option A collector -- SELF-CONTAINED. When a repo ships to an environment, it records ONE dated
# release entry (what changed in THAT repo since its previous deploy, grouped by day) into the per-env
# S3 ledger the in-app /releases page reads at runtime. Non-blocking by design: it never gates a deploy.
#
# The collector script is EMBEDDED below (base64) rather than checked out, so a cross-repo caller needs
# no seqtoid-web read token -- only that seqtoid-web's Actions "Access" allows org repos to call this
# reusable workflow. Keep the embedded blob in sync with script/changelog/collect.py (the canonical,
# lint-tested source): regenerate with `base64 script/changelog/collect.py`.
#
# Entry points:
#   - workflow_dispatch: run/backfill by hand.
#   - workflow_call: any repo's deploy pipeline invokes it after a successful ship, passing its own
#     component + repo (uses: IT-Academic-Research-Services/seqtoid-web/.github/workflows/record-changelog.yml@main).

on:
  workflow_dispatch:
    inputs:
      env_name:
        description: Environment shipped to (dev | staging | prod).
        required: true
        type: choice
        options: [dev, staging, prod]
      component:
        description: Deploy source (web | swipe | pipelines | reference | cli | ssot | workflow-infra).
        required: true
        type: string
      source_repo:
        description: OWNER/REPO to diff for PRs (defaults to seqtoid-web).
        required: false
        type: string
        default: IT-Academic-Research-Services/seqtoid-web
      new_sha:
        description: The shipped commit sha (7-8 hex, or a "sha-<commit>" tag).
        required: true
        type: string
      default_piece:
        description: Force all this deploy's changes to one piece (single-purpose repos).
        required: false
        type: string
        default: ""
      reason:
        description: Deployment reason (freeze, hotfix, issue id, ...).
        required: false
        type: string
        default: ""
  workflow_call:
    inputs:
      env_name:       { required: true,  type: string }
      component:      { required: true,  type: string }
      source_repo:    { required: false, type: string, default: IT-Academic-Research-Services/seqtoid-web }
      new_sha:        { required: true,  type: string }
      default_piece:  { required: false, type: string, default: "" }
      reason:         { required: false, type: string, default: "" }

permissions:
  id-token: write     # assume the S3-write role via OIDC
  contents: read

jobs:
  record:
    name: Record ${{ inputs.component }} -> ${{ inputs.env_name }}
    runs-on: ubuntu-latest
    # Dedicated NON-gated environment: holds CHANGELOG_S3_URI / CHANGELOG_S3_ROLE and matches the
    # changelog-writer OIDC sub. If unset (feature not provisioned for this env) the job no-ops.
    environment: changelog-${{ inputs.env_name }}
    steps:
      # Every step is continue-on-error: recording release notes is best-effort and must NEVER fail a
      # deploy that already succeeded.
      - name: Skip if not provisioned
        id: gate
        continue-on-error: true
        run: |
          if [ -z "${{ vars.CHANGELOG_S3_URI }}" ] || [ -z "${{ vars.CHANGELOG_S3_ROLE }}" ]; then
            echo "CHANGELOG_S3_URI / CHANGELOG_S3_ROLE not set for ${{ inputs.env_name }} -- skipping."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure AWS (ledger S3 write)
        if: steps.gate.outputs.run == 'true'
        continue-on-error: true
        uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d # v6
        with:
          role-to-assume: ${{ vars.CHANGELOG_S3_ROLE }}
          role-session-name: record-changelog
          aws-region: us-west-2

      - name: Append deploy to the ledger
        if: steps.gate.outputs.run == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}   # read PRs from the source repo
        run: |
          base64 -d > "$RUNNER_TEMP/collect.py" <<'B64EOF'
          IyEvdXNyL2Jpbi9lbnYgcHl0aG9uMwoiIiJSZWxlYXNlLW5vdGVzIGNvbGxlY3RvciAoT3B0aW9uIEEpIC0tIHBlci1kZXBsb3ks
