name: record-changelog (append a deploy to the notes ledger)

# Option A collector -- SELF-CONTAINED. When a repo ships to an environment, it records ONE dated
# release entry (what changed in THAT repo since its previous deploy, grouped by day) into the per-env
# S3 ledger the in-app /releases page reads at runtime. Non-blocking by design: it never gates a deploy.
#
# The collector script is EMBEDDED below (base64) rather than checked out, so a caller needs no
# seqtoid-web read token to RUN it -- only that seqtoid-web's Actions "Access" allows org repos to call
# this reusable workflow. Keep the embedded blob in sync with script/changelog/collect.py (the
# canonical, lint-tested source): regenerate with `base64 script/changelog/collect.py`.
#
# WHERE IT RUNS: the S3 write assumes the gha-deploy role, and an org SCP allowlists GitHub->AWS
# federation to a fixed set of CI subs -- so this MUST be invoked from an allowlisted caller,
# cypherid-web-infra main (see .github/workflows in that repo). A seqtoid-web-origin call cannot
# federate. To diff PRs for a private source_repo from that cross-repo context, pass GH App creds
# (app_id / app_private_key secrets, minted inside this job); without them, entries record no changes.
#
# Entry points:
#   - workflow_call: cypherid-web-infra's record-changelog caller invokes it after a ship / for backfill.

on:
  # workflow_call ONLY. Dispatch/backfill lives in cypherid-web-infra (an SCP-allowlisted caller);
  # a seqtoid-web-origin dispatch cannot federate to write S3, so it is not offered here.
  workflow_call:
    inputs:
      env_name:       { required: true,  type: string }
      component:      { required: true,  type: string }
      source_repo:    { required: false, type: string, default: IT-Academic-Research-Services/seqtoid-web }
      new_sha:        { required: true,  type: string }
      default_piece:  { required: false, type: string, default: "" }
      reason:         { required: false, type: string, default: "" }
    secrets:
      # Optional GH App creds (GH_ACTIONS_HELPER) with contents:read on source_repo. Minted INSIDE this
      # job (a step output) -- a mint job in the caller can't hand the token over, GitHub strips a job
      # output it detects as a secret ("Skip output 'token' since it may contain secret"), leaving it
      # empty. When the SCP forces the write to run outside source_repo (the gha-deploy / cypherid-web-
      # infra context), github.token cannot read a private seqtoid-web, so the collector needs this to
      # diff PRs. Absent -> falls back to github.token (only works when the caller IS source_repo).
      app_id: { required: false }
      app_private_key: { required: false }

permissions:
  id-token: write     # assume the S3-write role via OIDC
  contents: read

jobs:
  record:
    name: Record ${{ inputs.component }} -> ${{ inputs.env_name }}
    runs-on: ubuntu-latest
    steps:
      # Every step is continue-on-error: recording release notes is best-effort and must NEVER fail a
      # deploy that already succeeded. The ledger bucket + writer role are DERIVED from env_name below.
      # The writer role is gha-deploy (ssot foundation main.tf grants it this bucket): an org SCP
      # allowlists GitHub->AWS federation to a fixed set of CI subs, so this MUST be invoked from an
      # allowlisted caller -- cypherid-web-infra main (gha-deploy's sub). A seqtoid-web-origin call
      # cannot federate and will no-op the S3 write.
      - name: Resolve ledger target (enabled envs only)
        id: gate
        continue-on-error: true
        run: |
          # Enabled env -> (account, writer role). The writer is whichever role in that env already
          # federates the cypherid-web-infra main caller and holds write on seqtoid-<env>-release-notes:
          #   staging: seqtoid-staging-gha-deploy (ssot foundation grants the bucket; SCP-allowlisted).
          #   dev:     czid-dev-gh-actions-executor (legacy czid-dev; bucket + grant in cypherid-web-infra
          #            dev TF release-notes-bucket.tf). Dev has no SCP, so the executor sub is admitted.
          # Add an env here once its bucket + writer grant exist.
          case "${{ inputs.env_name }}" in
            staging) ACCT=030998640247; ROLE=seqtoid-staging-gha-deploy ;;
            dev)     ACCT=491013321714; ROLE=czid-dev-gh-actions-executor ;;
            *)
              echo "release-notes not enabled for ${{ inputs.env_name }} -- skipping."
              echo "run=false" >> "$GITHUB_OUTPUT"; exit 0 ;;
          esac
          {
            echo "run=true"
            echo "s3_uri=s3://seqtoid-${{ inputs.env_name }}-release-notes/release-notes"
            echo "role_arn=arn:aws:iam::${ACCT}:role/${ROLE}"
          } >> "$GITHUB_OUTPUT"

      - name: Configure AWS (ledger S3 write)
        if: steps.gate.outputs.run == 'true'
        continue-on-error: true
        uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d # v6
        with:
          role-to-assume: ${{ steps.gate.outputs.role_arn }}
          role-session-name: record-changelog
          aws-region: us-west-2

      # Mint the source-repo read token HERE (step output) so it isn't stripped as a job output.
      - name: Mint source-repo read token
        id: read_token
        # continue-on-error: when app creds are absent (forks) the action fails and token stays unset,
        # so the collector falls back to github.token. (secrets can't be tested in a step `if`.)
        if: steps.gate.outputs.run == 'true'
        continue-on-error: true
        uses: chanzuckerberg/github-app-token@365b1f2db827eb8f17288ec335b1a7e3c03ff683 # v1.1.4
        with:
          app_id: ${{ secrets.app_id }}
          private_key: ${{ secrets.app_private_key }}

      - name: Append deploy to the ledger
        if: steps.gate.outputs.run == 'true'
        continue-on-error: true
        env:
          # The app token (contents:read on source_repo) when running cross-repo under gha-deploy;
          # else github.token (only reads PRs when the caller IS source_repo).
          GH_TOKEN: ${{ steps.read_token.outputs.token || github.token }}
        run: |
          base64 -d > "$RUNNER_TEMP/collect.py" <<'B64EOF'
          IyEvdXNyL2Jpbi9lbnYgcHl0aG9uMwoiIiJSZWxlYXNlLW5vdGVzIGNvbGxlY3RvciAoT3B0aW9u
          IEEpIC0tIHBlci1kZXBsb3ksIGdyb3VwZWQgYnkgZGF5LgoKRWFjaCBkZXBsb3kgcGlwZWxpbmUg
