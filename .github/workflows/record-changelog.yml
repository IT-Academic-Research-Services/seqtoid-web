name: record-changelog (append a deploy to the notes ledger)

# Option A collector. When a repo ships to an environment, it records ONE dated release entry --
# what changed in THAT repo since its previous deploy, grouped by day -- into the per-env S3 ledger
# the in-app /releases page reads at runtime. Non-blocking by design: it never gates a deploy.
#
# Entry points:
#   - workflow_dispatch: run/backfill by hand.
#   - workflow_call: any repo's deploy pipeline invokes it after a successful ship, passing its own
#     component + repo (cross-repo: uses IT-Academic-Research-Services/seqtoid-web/.github/workflows/...).

on:
  workflow_dispatch:
    inputs:
      env_name:
        description: Environment shipped to (dev | staging | prod).
        required: true
        type: choice
        options: [dev, staging, prod]
      component:
        description: Deploy source (web | swipe | pipelines | reference | cli | ssot | workflow-infra).
        required: true
        type: string
      source_repo:
        description: OWNER/REPO to diff for PRs (defaults to seqtoid-web).
        required: false
        type: string
        default: IT-Academic-Research-Services/seqtoid-web
      new_sha:
        description: The shipped commit sha (7-8 hex, no "sha-" prefix).
        required: true
        type: string
      default_piece:
        description: Force all this deploy's changes to one piece (single-purpose repos).
        required: false
        type: string
        default: ""
      reason:
        description: Deployment reason (freeze, hotfix, issue id, ...).
        required: false
        type: string
        default: ""
  workflow_call:
    inputs:
      env_name:       { required: true,  type: string }
      component:      { required: true,  type: string }
      source_repo:    { required: false, type: string, default: IT-Academic-Research-Services/seqtoid-web }
      new_sha:        { required: true,  type: string }
      default_piece:  { required: false, type: string, default: "" }
      reason:         { required: false, type: string, default: "" }

permissions:
  id-token: write     # assume the S3-write role via OIDC
  contents: read      # checkout + read PRs

jobs:
  record:
    name: Record ${{ inputs.component }} -> ${{ inputs.env_name }}
    runs-on: ubuntu-latest
    # Bucket + writer role live per environment (env vars). If unset (feature not yet provisioned for
    # this env) the job no-ops rather than failing, so it can never affect a deploy.
    environment: changelog-${{ inputs.env_name }}
    steps:
      # Every step is continue-on-error: recording release notes is best-effort and must NEVER fail a
      # deploy that already succeeded. A broken collector shows as a skipped/annotated step, not a red run.
      - name: Checkout seqtoid-web (the collector script)
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: IT-Academic-Research-Services/seqtoid-web
          sparse-checkout: script/changelog

      - name: Skip if not provisioned
        id: gate
        continue-on-error: true
        run: |
          if [ -z "${{ vars.CHANGELOG_S3_URI }}" ] || [ -z "${{ vars.CHANGELOG_S3_ROLE }}" ]; then
            echo "CHANGELOG_S3_URI / CHANGELOG_S3_ROLE not set for ${{ inputs.env_name }} -- skipping."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure AWS (ledger S3 write)
        if: steps.gate.outputs.run == 'true'
        continue-on-error: true
        uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d # v6
        with:
          role-to-assume: ${{ vars.CHANGELOG_S3_ROLE }}
          role-session-name: record-changelog
          aws-region: us-west-2

      - name: Append deploy to the ledger
        if: steps.gate.outputs.run == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}   # read PRs from the source repo
        run: |
          python3 script/changelog/collect.py \
            --env "${{ inputs.env_name }}" \
            --component "${{ inputs.component }}" \
            --repo "${{ inputs.source_repo }}" \
            --new-sha "${{ inputs.new_sha }}" \
            --s3-uri "${{ vars.CHANGELOG_S3_URI }}" \
            --default-piece "${{ inputs.default_piece }}" \
            --reason "${{ inputs.reason }}" \
            --md
