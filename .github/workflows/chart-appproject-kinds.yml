# Catch a chart template whose resource KIND the Argo AppProject does not permit.
#
# Argo rejects a not-permitted resource and INVALIDATES THE WHOLE SYNC, so the namespace is never
# created and the app never serves -- the developer just sees a preview sandbox time out, with the
# real reason buried in Application.status.operationState. That is exactly how preview sandboxes
# broke when the chart gained a PodDisruptionBudget the seqtoid-preview project did not allow.
#
# This runs where templates are ADDED (this repo), so the person adding one finds the gap, rather
# than the next contributor who opens a sandbox.
name: chart / AppProject kinds

on:
  pull_request:
    paths:
      - 'deploy/charts/**'
      - 'scripts/check-chart-appproject-kinds.py'
      - '.github/workflows/chart-appproject-kinds.yml'

permissions:
  contents: read

jobs:
  kinds:
    # Gated on a repo VARIABLE, not github.event.repository.fork: GitHub reports the canonical
    # IT-ARS repo as isFork=TRUE and the personal fork as FALSE, so a fork-flag gate disables this
    # exactly where it is needed (see platform-overhaul #692). Forks leave it unset and skip, since
    # they cannot read the infra repo anyway.
    if: ${{ vars.CHART_KINDS_CHECK_ENABLED == 'true' }}
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout app
        uses: actions/checkout@v6

      - name: Generate app token
        id: app_token
        if: ${{ vars.CI_APP_ENABLED == 'true' }}
        uses: chanzuckerberg/github-app-token@365b1f2db827eb8f17288ec335b1a7e3c03ff683 # v1.1.4
        with:
          app_id: ${{ secrets.GH_ACTIONS_HELPER_APP_ID }}
          private_key: ${{ secrets.GH_ACTIONS_HELPER_PK }}

      # The AppProject and the environment values live in the infra repo; the chart lives here.
      # Same INFRA_REPO convention as gitops-advance-dev.yml / promote-to-env.yml.
      - name: Checkout infra
        uses: actions/checkout@v6
        with:
          repository: ${{ vars.INFRA_REPO || format('{0}/cypherid-web-infra', github.repository_owner) }}
          token: ${{ steps.app_token.outputs.token || secrets.GITOPS_TOKEN }}
          path: infra

      - name: Install helm + pyyaml
        run: |
          curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
          python3 -m pip install --quiet pyyaml

      - name: Chart kinds must be permitted by the preview AppProject
        run: |
          python3 scripts/check-chart-appproject-kinds.py \
            --chart deploy/charts/seqtoid-web \
            --values infra/deploy/argocd/values/seqtoid-web/preview-base.yaml \
            --appproject infra/deploy/argocd/projects/seqtoid-preview.yaml
